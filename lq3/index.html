// ひとり たびの あいだは じょうたい いじょうを うけにくくする
function statusText(type){
  return type==='sleep'   ? 'ねむってしまった！'
       : type==='confuse' ? 'こんらんした！'
       : type==='freeze'  ? 'こおりついた！'
       : type==='slow'    ? 'うごきが にぶった！'
       : 'じょうたいが おかしい！';
}
// にぶっていると すばやさが はんぶんに なる（こうどうは できる）
function effAgi(m){ return m.status==='slow' ? m.agi*0.5 : m.agi; }
function inflictP(e){
  if(!e.inflict) return 0;
  return party.length===1 ? e.inflict.p*0.6 : e.inflict.p;
}
function makeEnemy(def){
  const e = JSON.parse(JSON.stringify(def));
  e.maxhp = e.hp; e.dispName = e.name; e.status = null;
  return e;
}
function startBattle(kind){
  if(A.battleBgm) A.battleBgm(kind ? 'boss' : 'battle');
  let enemies;
  if(kind){
    enemies = [makeEnemy(MIDBOSS[kind])];
    // ★そうしボス：章データに pair が あれば 2たいで あらわれる
    {
      const bi = bossInfoAt(P.map);
      if(bi && bi.key === kind && bi.pair && MIDBOSS[bi.pair]){
        enemies.push(makeEnemy(MIDBOSS[bi.pair]));
      }
    }
  }else{
    // レベルが たりない まものは まだ でてこない（はじまりの ちいきを あんぜんに たもつ）
    let all = byMapCh[(G.chapter||1)+':'+P.map] || byMap[P.map];
    if(!all){
      const m=MAPS[P.map];
      const z=(m&&m.encZones||[]).find(z=>P.x>=z.x0&&P.x<=z.x1&&P.y>=z.y0&&P.y<=z.y1);
      all = z ? z.pool : ['icicleslime'];
    }
    const plv = party[0].lv;
    let pool = all.filter(k=>{
      const e = ENEMIES.find(x=>x.key===k);
      return !e || !e.minLv || e.minLv<=plv;
    });
    // どれも でられない ＝ レベルが たりないのに おくへ きた ばあい。
    // ここは まもらない（ふかいりの きけんは のこす）
    if(!pool.length) pool = all;
    const lv = party[0].lv;
    const byLv    = lv<4 ? 1 : (lv<9 ? 2 : 3);          // レベルが ひくいうちは たいぐんに ならない
    // ★ひとりの ときも、そだつに つれて かずを ふやす。
    //   2たい どまりだと けいけんちが たまらず、レベルあげが ながすぎる
    //   （第2章で Lv12まで 188せん かかっていた）。
    const byParty = party.length===1 ? (lv<5 ? 1 : lv<9 ? 2 : 3)
                                     : party.length+1;
    const maxN = Math.min(byLv, byParty);
    const n = Math.min(maxN, 1 + (Math.random()<0.45?1:0) + (Math.random()<0.18?1:0));
    enemies = [];
    for(let i=0;i<n;i++){
      const key = pool[Math.floor(Math.random()*pool.length)];
      enemies.push(makeEnemy(ENEMIES.find(x=>x.key===key)));
    }
  }
  // おなじ しゅるいが ふくすう いるときは A・B・C を つけて みわけられるように する
  const cnt0={};
  enemies.forEach(e=>{ cnt0[e.name]=(cnt0[e.name]||0)+1; });
  const idx={};
  enemies.forEach(e=>{
    if(cnt0[e.name]>1){
      idx[e.name]=(idx[e.name]||0)+1;
      e.dispName = e.name + 'ABCDEF'.charAt(idx[e.name]-1);
    }
  });
  enemies.forEach(e=>{ const d=G.dex[e.key]=G.dex[e.key]||{seen:0,kill:0}; d.seen++; });
  G.battle = {enemies, named:kind||null, round:0, order:[], queue:[], fled:false};
  G.mode='battle';
  // ★ここで A.bgm() を よぶと きょくが とまる（bgm は フィールドようで、
  //   いまは とめる しょりに なっている）。せんとうきょくは startBattle で たのむ。
  V.battleEnter(enemies, ()=>{
    const cnt={}; enemies.forEach(e=>{ cnt[e.name]=(cnt[e.name]||0)+1; });
    const intro = Object.keys(cnt).map(n=>cnt[n]>1?n+' '+cnt[n]+'たい':n).join('と ')+'が あらわれた！';
    U.msg([intro], ()=>beginRound());
  });
}
function beginRound(){
  const b=G.battle; if(!b) return;
  b.round++;
  if(b.round>200){ endBattle(false); return; }  // 安全弁
  b.queue=[];
  // じょうたい いじょうの かいふく はんてい
  // ひとりの ときは、ねむり・こんらんで なにも できない じかんが ながすぎるため さめやすくする
  const solo = party.length===1;
  const wakeSleep   = solo ? 0.60 : 0.34;
  const wakeConfuse = solo ? 0.62 : 0.38;
  const wakeFreeze  = solo ? 0.62 : 0.40;   // こおりは とけやすい
  const wakeSlow    = 0.30;                 // にぶりは こうどうできるので きゅうさいは しない
  // ★なおった ことを かならず しらせる。
  //   しらせが ないと 「じねんに なおらない」と おもわれて しまう。
  const RECOVER_MSG = {
    sleep:  'は めを さました！',
    confuse:'は しょうきに もどった！',
    freeze: 'の こおりが とけた！',
    slow:   'の うごきが もどった！',
  };
  const healed = [];
  party.forEach(m=>{
    const st = m.status;
    let ok = false;
    if(st==='sleep'   && Math.random()<wakeSleep)   ok = true;
    else if(st==='confuse' && Math.random()<wakeConfuse) ok = true;
    else if(st==='freeze'  && Math.random()<wakeFreeze)  ok = true;
    else if(st==='slow'    && Math.random()<wakeSlow)    ok = true;
    if(ok){ m.status = null; healed.push(m.name + (RECOVER_MSG[st] || 'は もとに もどった！')); }
  });
  if(healed.length){
    U.msg(healed, ()=>{ U.hud(); collectCommands(0); });
    return;
  }
  collectCommands(0);
}
function collectCommands(i){
  const b=G.battle; if(!b) return;
  const list = party.filter(p=>p.hp>0);
  if(i>=list.length){ resolveRound(); return; }
  const m = list[i];
  if(m.status==='sleep'){ b.queue.push({actor:m, type:'sleep'}); collectCommands(i+1); return; }
  if(m.status==='confuse'){ b.queue.push({actor:m, type:'confused'}); collectCommands(i+1); return; }
  if(m.status==='freeze'){ b.queue.push({actor:m, type:'frozen'}); collectCommands(i+1); return; }
  if(G.tactic!=='manual'){ b.queue.push(autoCommand(m)); collectCommands(i+1); return; }
  G.menu={kind:'battle'};
  const items=['こうげき','じゅもん','どうぐ','ぼうぎょ','にげる'];
  U.menu(items, m.name, (sel)=>{
    if(sel===0){
      chooseTarget(m, (tgt)=>{
        if(tgt===null){ collectCommands(i); return; }        // もどる
        b.queue.push({actor:m, type:'attack', tgt}); collectCommands(i+1);
      });
    }
    else if(sel===1){
      const sp = knownSpells(m).filter(s=>s.mp<=m.mp);
      if(!sp.length){ G.mode='msg'; U.msg(['つかえる じゅもんが ない！'], ()=>{ G.mode='battle'; collectCommands(i); }); return; }
      U.menu(sp.map(spellLabel).concat(['もどる']), m.name+'　じゅもん', (k)=>{
        if(k>=sp.length){ collectCommands(i); return; }
        const chosen=sp[k];
        if(chosen.type==='dmg'){                             // たんたい こうげき じゅもんは あいてを えらぶ
          chooseTarget(m, (tgt)=>{
            if(tgt===null){ collectCommands(i); return; }
            b.queue.push({actor:m, type:'spell', sp:chosen, tgt}); collectCommands(i+1);
          });
          return;
        }
        // ★かいふく・じょうたいかいふく・そせいは 「だれに つかうか」を えらぶ
        if(spellNeedsTarget(chosen)){
          chooseMember(m, chosen, (tgt)=>{
            if(tgt===null){ collectCommands(i); return; }
            b.queue.push({actor:m, type:'spell', sp:chosen, tgt}); collectCommands(i+1);
          });
          return;
        }
        b.queue.push({actor:m, type:'spell', sp:chosen}); collectCommands(i+1);
      });
    }
    else if(sel===2){
      const opts=[];
      if(P.herbs>0) opts.push('やくそう '+P.herbs);
      if(P.waters>0) opts.push('まほうのせいすい '+P.waters);
      if(!opts.length){ G.mode='msg'; U.msg(['どうぐが ない！'], ()=>{ G.mode='battle'; collectCommands(i); }); return; }
      U.menu(opts.concat(['もどる']), 'どうぐ', (k)=>{
        if(k>=opts.length){ collectCommands(i); return; }
        b.queue.push({actor:m, type:opts[k].startsWith('やくそう')?'herb':'water'}); collectCommands(i+1);
      });
    }
    else if(sel===3){ b.queue.push({actor:m, type:'guard'}); collectCommands(i+1); }
    else { b.queue.push({actor:m, type:'flee'}); collectCommands(i+1); }
  });
}
function bestHeal(m, need){
  const sp = knownSpells(m).filter(s=>s.type==='heal' && s.mp<=m.mp).sort((a,b)=>b.max-a.max);
  if(!sp.length) return null;
  const enough = sp.filter(s=>s.max>=need).sort((a,b)=>a.mp-b.mp);
  return enough[0] || sp[0];      // まかなえる いちばん やすい じゅもん／なければ さいだい
}
// あいてが 2たい いじょう なら えらばせる。1たいなら そのまま。
// ★せんとうちゅうに 「だれに つかうか」を えらぶ。
//   ひとりしか いない ときは きかない。
const STATUS_JP = {sleep:'ねむり', confuse:'こんらん', freeze:'こおり', slow:'にぶり'};
function chooseMember(m, sp, done){
  const alive = (sp.type==='revive') ? party.filter(p=>p.hp<=0) : aliveMembers();
  if(!alive.length){ done(null); return; }
  if(alive.length===1){ done(alive[0]); return; }
  const label = alive.map(p=>{
    if(sp.type==='heal')  return p.name + '　HP' + p.hp + '/' + p.maxhp;
    if(sp.type==='cure')  return p.name + '　' + (p.status ? (STATUS_JP[p.status]||p.status) : 'そうかい');
    return p.name;
  });
  U.menu(label.concat(['もどる']), sp.name + '　だれに？', (k)=>{
    done(k >= alive.length ? null : alive[k]);
  });
}
function chooseTarget(m, cb){
  const alive = G.battle.enemies.filter(e=>e.hp>0);
  if(alive.length<=1){ cb(alive[0]||null); return; }
  U.menu(alive.map(e=>e.dispName).concat(['もどる']), 'だれを ねらう？', (k)=>{
    cb(k>=alive.length ? null : alive[k]);
  });
}
function autoCommand(m){
  const b=G.battle;
  const sp = knownSpells(m).filter(s=>s.mp<=m.mp);
  // ① たおれた なかまの そせい
  const dead = party.find(p=>p.hp<=0);
  if(dead){
    const rv = sp.find(s=>s.type==='revive');
    if(rv) return {actor:m, type:'spell', sp:rv, tgt:dead};
  }
  // ②-a ぜんたいかいふく（3にん いじょう きずついていたら）
  const hurtAll = party.filter(p=>p.hp>0 && p.hp<p.maxhp*0.62);
  if(hurtAll.length>=2){
    const ha = sp.filter(s=>s.type==='healall').sort((a,c)=>c.max-a.max)[0];
    if(ha) return {actor:m, type:'spell', sp:ha};
  }
  // ② かいふく（のこりHPの わりあいで はんだん）
  const wounded = party.filter(p=>p.hp>0 && p.hp<p.maxhp)
                       .sort((a,c)=>a.hp/a.maxhp - c.hp/c.maxhp);
  if(wounded.length){
    const tgt = wounded[0], need = tgt.maxhp - tgt.hp, ratio = tgt.hp/tgt.maxhp;
    const limit = (G.tactic==='inochi') ? 0.62 : 0.42;
    if(ratio < limit){
      const h = bestHeal(m, need);
      if(h) return {actor:m, type:'spell', sp:h, tgt};
      if(P.herbs>0 && ratio<0.34) return {actor:m, type:'herb', tgt};
    }
  }
  // ③ MPぎれなら せいすい
  if(m.maxmp>0 && m.mp<6 && P.waters>0 && knownSpells(m).some(s=>s.type==='heal'))
    return {actor:m, type:'water', tgt:m};
  // ④ こうげき
  const alive = b.enemies.filter(e=>e.hp>0);
  const dmg = sp.filter(s=>s.type==='dmg'||s.type==='dmgall');
  if(dmg.length && alive.length>=2){
    const all = dmg.find(s=>s.type==='dmgall');
    if(all && m.mp >= all.mp*2) return {actor:m, type:'spell', sp:all};
  }
  const single = dmg.filter(s=>s.type==='dmg').sort((a,c)=>c.max-a.max)[0];
  if(single && m.mp > single.mp*3 && mAtk(m) < single.max)
    return {actor:m, type:'spell', sp:single,
            tgt:alive.slice().sort((x,y)=>x.hp-y.hp)[0]};   // ぶつりが よわい なかまは じゅもん
  const weakest = alive.slice().sort((x,y)=>x.hp-y.hp)[0];
  return {actor:m, type:'attack', tgt:weakest};
}
function resolveRound(){
  const b=G.battle; if(!b) return;
  const acts = b.queue.slice();
  b.enemies.filter(e=>e.hp>0).forEach(e=>{
    const n = e.acts||1;
    for(let i=0;i<n;i++) acts.push({enemy:e, type:'enemy'});
  });
  acts.sort((a,c)=>{
    const av = a.actor?effAgi(a.actor):(a.enemy.agi);
    const cv = c.actor?effAgi(c.actor):(c.enemy.agi);
    return (cv+Math.random()*4)-(av+Math.random()*4);
  });
  party.forEach(p=>p.guard=false);
  stepAction(acts,0);
}
function stepAction(acts,i){
  const b=G.battle; if(!b) return;
  if(b.enemies.every(e=>e.hp<=0)){ victory(); return; }
  if(aliveMembers().length===0){ defeat(); return; }
  if(i>=acts.length){ beginRound(); return; }
  const a = acts[i];
  const next = ()=>stepAction(acts,i+1);
  if(a.type==='enemy'){
    if(a.enemy.hp<=0){ next(); return; }
    enemyAct(a.enemy, next); return;
  }
  if(a.actor.hp<=0){ next(); return; }
  memberAct(a, next);
}
function memberAct(a, done){
  const b=G.battle, m=a.actor;
  const alive = b.enemies.filter(e=>e.hp>0);
  if(a.type==='sleep'){ U.msg([m.name+'は ねむっている…'], done); return; }
  if(a.type==='frozen'){ U.msg([m.name+'は こおりついて うごけない！'], done); return; }
  if(a.type==='confused'){ // こんらん：てきか みかたか わからなくなる
    const allies=aliveMembers().filter(p=>p!==m);
    if(Math.random()<0.45 && allies.length){
      const t2=allies[Math.floor(Math.random()*allies.length)];
      const d2=Math.max(1, Math.floor(mAtk(m)*0.6) - Math.floor(mDef(t2)/2));
      t2.hp-=d2; A.hit(); U.hud();
      const l=[m.name+'は こんらんしている！', m.name+'は '+t2.name+'を こうげき！',
               t2.name+'は '+d2+'の ダメージを うけた！'];
      if(t2.hp<=0){ t2.hp=0; t2.status=null; l.push(t2.name+'は たおれた…'); }
      U.msg(l, done); return;
    }
    U.msg([m.name+'は こんらんしている！', m.name+'は ふらふらと あるきまわった。'], done);
    return;
  }
  if(a.type==='guard'){ m.guard=true; U.msg([m.name+'は みを まもっている。'], done); return; }
  if(a.type==='flee'){
    if(b.named){ U.msg(['にげられない！'], done); return; }
    if(Math.random()<0.6){ b.fled=true; if(A.flee) A.flee();
      U.msg([m.name+'たちは にげだした！'], ()=>endBattle(false)); }
    else U.msg([m.name+'は にげようとしたが まわりこまれた！'], done);
    return;
  }
  if(a.type==='herb'){
    if(P.herbs<=0){ done(); return; }
    P.herbs--;
    const t = a.tgt && a.tgt.hp>0 ? a.tgt : aliveMembers().sort((x,y)=>x.hp/x.maxhp-y.hp/y.maxhp)[0];
    const h = Math.min(t.maxhp-t.hp, 20+Math.floor(Math.random()*9));
    t.hp+=h; A.heal(); U.hud();
    V.fx('heal',{member:t}, ()=>U.msg([m.name+'は やくそうを つかった！', t.name+'の HPが '+h+' かいふく！'], done));
    return;
  }
  if(a.type==='water'){
    if(P.waters<=0){ done(); return; }
    P.waters--;
    const t = a.tgt && a.tgt.hp>0 ? a.tgt : aliveMembers().filter(p=>p.maxmp>0).sort((x,y)=>x.mp-y.mp)[0]||m;
    const h = Math.min(t.maxmp-t.mp, 30);
    t.mp+=h; A.heal(); U.hud();
    U.msg([m.name+'は まほうのせいすいを つかった！', t.name+'の MPが '+h+' かいふく！'], done);
    return;
  }
  if(a.type==='spell'){
    const sp=a.sp;
    if(m.mp<sp.mp){ U.msg([m.name+'は MPが たりない！'], done); return; }
    m.mp-=sp.mp; U.hud();
    if(sp.type==='heal'){
      const t = a.tgt && a.tgt.hp>0 ? a.tgt : aliveMembers().sort((x,y)=>x.hp/x.maxhp-y.hp/y.maxhp)[0];
      const h = Math.min(t.maxhp-t.hp, sp.min+Math.floor(Math.random()*(sp.max-sp.min+1)));
      t.hp+=h; A.heal(); U.hud();
      V.fx('heal',{member:t}, ()=>U.msg([m.name+'は '+sp.name+'を となえた！', t.name+'の HPが '+h+' かいふく！'], done));
      return;
    }
    if(sp.type==='healall'){
      const targets=aliveMembers();
      const lines=[m.name+'は '+sp.name+'を となえた！'];
      A.heal();
      targets.forEach(tg=>{
        const h=Math.min(tg.maxhp-tg.hp, sp.min+Math.floor(Math.random()*(sp.max-sp.min+1)));
        if(h>0){ tg.hp+=h; lines.push(tg.name+'の HPが '+h+' かいふく！'); }
      });
      if(lines.length===1) lines.push('しかし こうかが なかった。');
      U.hud();
      V.fx('heal',{}, ()=>U.msg(lines, done));
      return;
    }
    if(sp.type==='cure'){
      const t = party.find(p=>p.status) || m;
      t.status=null; A.heal();
      U.msg([m.name+'は '+sp.name+'を となえた！', t.name+'の じょうたいが もどった。'], done);
      return;
    }
    if(sp.type==='revive'){
      const t = party.find(p=>p.hp<=0);
      if(!t){ U.msg(['しかし こうかが なかった。'], done); return; }
      t.hp=Math.ceil(t.maxhp/2); t.status=null; A.heal(); U.hud();
      U.msg([m.name+'は '+sp.name+'を となえた！', t.name+'は いきかえった！'], done);
      return;
    }
    if(sp.type==='dmgall'){
      const lines=[m.name+'は '+sp.name+'を となえた！'];
      A.hit();
      V.fx('spellall',{}, ()=>{
        alive.forEach(e=>{
          const d = sp.min+Math.floor(Math.random()*(sp.max-sp.min+1));
          e.hp-=d; lines.push(e.dispName+'に '+d+'の ダメージ！');
          if(e.hp<=0){ e.hp=0; lines.push(e.dispName+'を たおした！'); killed(e); }
        });
        U.msg(lines, done);
      });
      return;
    }
    if(A.spell) A.spell();
    // ★defdown：あいての しゅびりょくを さげる
    if(sp.type==='defdown'){
      const alive = b.enemies.filter(e=>e.hp>0);
      if(!alive.length){ done(); return; }
      const tg = (a.tgt && a.tgt.hp>0) ? a.tgt : alive[0];
      m.mp -= sp.mp;
      const cut = sp.cut || 8;
      const before = eDef(tg);
      tg.defDown = {v:Math.min((tg.def|0), ((tg.defDown&&tg.defDown.v)||0) + cut)};
      const after = eDef(tg);
      const lines=[m.name+'は '+sp.name+'を となえた！'];
      if(after < before) lines.push(tg.dispName+'の しゅびりょくが さがった！');
      else lines.push(tg.dispName+'には きかなかった。');
      U.msg(lines, done);
      return;
    }
    // dmg（単体）：えらんだ あいてが たおれていたら ほかへ
    const t = (a.tgt && a.tgt.hp>0) ? a.tgt : alive[0];
    if(!t){ done(); return; }
    const d = sp.min+Math.floor(Math.random()*(sp.max-sp.min+1));
    A.hit();
    V.fx('spell',{target:t}, ()=>{
      t.hp-=d;
      const lines=[m.name+'は '+sp.name+'を となえた！', t.dispName+'に '+d+'の ダメージ！'];
      if(t.hp<=0){ t.hp=0; lines.push(t.dispName+'を たおした！'); killed(t); }
      U.msg(lines, done);
    });
    return;
  }
  // 通常こうげき：えらんだ あいてが たおれていたら ほかへ
  const t = (a.tgt && a.tgt.hp>0) ? a.tgt
          : alive[Math.floor(Math.random()*alive.length)];
  if(!t){ done(); return; }
  const crit = Math.random()<1/16;
  let d = Math.max(1, mAtk(m) - Math.floor(eDef(t)/2) + Math.floor(Math.random()*5) - 2);
  if(crit) d = Math.floor(d*2);
  if(t.tough) d = crit ? Math.max(2, Math.floor(d*0.3)) : (Math.random()<0.5?1:2); // めったに きかない
  A.hit();
  V.fx('attack',{member:m, target:t}, ()=>{
    t.hp-=d;
    const lines=[m.name+'の こうげき！'];
    if(crit) lines.push('かいしんの いちげき！！');
    lines.push(t.dispName+'に '+d+'の ダメージ！');
    if(t.hp<=0){ t.hp=0; lines.push(t.dispName+'を たおした！'); killed(t); }
    U.msg(lines, done);
  });
}
// ★てきの しゅびりょく（よわめられて いれば さがる）
function eDef(e){
  const cut = e.defDown ? e.defDown.v : 0;
  return Math.max(0, (e.def|0) - cut);
}
function killed(e){ const d=G.dex[e.key]=G.dex[e.key]||{seen:1,kill:0}; d.kill++;
  // ★いらい（たおした かずを かぞえる）
  if(G.quota && G.quota.n < G.quota.need){
    G.quota.n++;
    if(G.quota.n >= G.quota.need) G.flags[G.quota.flag] = true;
  }
  if(A.defeat) A.defeat(); V.refresh(); }
function enemyAct(e, done){
  const alive = aliveMembers();
  if(!alive.length){ defeat(); return; }
  const lines=[];
  // にげる（ルスライム）
  if(e.fleeP && Math.random()<e.fleeP){
    e.hp=0; e.fled=true; V.refresh();
    U.msg([e.dispName+'は すばやく にげだした！'], ()=>{
      const b2=G.battle;
      if(b2 && b2.enemies.every(x=>x.hp<=0)){
        if(b2.enemies.every(x=>x.fled)) U.msg(['……にがして しまった。'], ()=>endBattle(false));
        else victory();
        return;
      }
      done();
    });
    return;
  }
  // とくぎ
  if(e.skill && Math.random()<e.skill.p){
    const ts=alive[Math.floor(Math.random()*alive.length)];
    let ds=Math.max(1, Math.floor(e.atk*e.skill.mul) - Math.floor(mDef(ts)/2) + Math.floor(Math.random()*5)-2);
    if(ts.guard) ds=Math.max(1, Math.ceil(ds*0.4));
    A.cue(); A.ehit();
    V.fx('enemyattack',{target:ts, from:e}, ()=>{
      ts.hp-=ds;
      lines.push(e.dispName+'の '+e.skill.name+'！',
                 ts.name+'は '+ds+'の ダメージを うけた！'+(ts.guard?'（ぼうぎょ）':''));
      if(e.drain){
        const h=Math.min(e.maxhp-e.hp, Math.floor(ds*e.drain));
        if(h>0){ e.hp+=h; lines.push(e.dispName+'は HPを '+h+' すいとった！'); }
      }
      if(ts.hp<=0){ ts.hp=0; ts.status=null; lines.push(ts.name+'は たおれた…'); }
      else if(e.inflict && Math.random()<inflictP(e) && !ts.status){
        ts.status=e.inflict.type;
        lines.push(ts.name+'は '+statusText(e.inflict.type));
      }
      U.hud(); U.msg(lines, done);
    });
    return;
  }
  // じゅもん
  if(e.spell && Math.random()<e.spell.p){
    const sp=e.spell;
    if(sp.kind==='heal'){
      const hurt=(G.battle.enemies.filter(x=>x.hp>0&&x.hp<x.maxhp)
                  .sort((a2,b2)=>a2.hp/a2.maxhp-b2.hp/b2.maxhp))[0];
      const tg=hurt||e;
      const h=Math.min(tg.maxhp-tg.hp, sp.lo+Math.floor(Math.random()*(sp.hi-sp.lo+1)));
      tg.hp+=h; A.heal();
      U.msg([e.dispName+'は '+sp.name+'を となえた！',
             tg.dispName+'の きずが ふさがった！ HPが '+h+' かいふく！'], done);
      return;
    }
    const tp=alive[Math.floor(Math.random()*alive.length)];
    let dp=sp.lo+Math.floor(Math.random()*(sp.hi-sp.lo+1));
    dp=Math.max(1, dp - Math.floor(mDef(tp)/5));
    if(tp.guard) dp=Math.max(1, Math.ceil(dp*0.5));
    A.cue(); A.ehit();
    V.fx('enemyattack',{target:tp, from:e}, ()=>{
      tp.hp-=dp;
      lines.push(e.dispName+'は '+sp.name+'を となえた！',
                 tp.name+'は '+dp+'の ダメージを うけた！');
      if(tp.hp<=0){ tp.hp=0; tp.status=null; lines.push(tp.name+'は たおれた…'); }
      else{
        const inf = e.spellInflict || e.inflict;     // うたは ねむらせ、まなざしは にぶらせる
        if(inf && Math.random()<inflictP({inflict:inf}) && !tp.status){
          tp.status=inf.type;
          lines.push(tp.name+'は '+statusText(inf.type));
        }
      }
      U.hud(); U.msg(lines, done);
    });
    return;
  }
  // ぜんたいわざ
  if(e.aoe && Math.random()<e.aoe.p){
    lines.push(e.dispName+'は '+e.aoe.name+'を はなった！');
    A.cue(); A.ehit();
    V.fx('enemyaoe',{from:e}, ()=>{
      alive.forEach(m=>{
        let d = e.aoe.lo + Math.floor(Math.random()*(e.aoe.hi-e.aoe.lo+1));
        d = Math.max(1, d - Math.floor(mDef(m)/4));   // いき・ぜんたいわざにも そうびが きく
        if(m.guard) d = Math.max(1, Math.ceil(d*0.4));
        m.hp-=d; lines.push(m.name+'は '+d+'の ダメージ！'+(m.guard?'（ぼうぎょ）':''));
        if(m.hp<=0){ m.hp=0; m.status=null; lines.push(m.name+'は たおれた…'); }
      });
      U.hud(); U.msg(lines, done);
    });
    return;
  }
  const t = alive[Math.floor(Math.random()*alive.length)];
  let d = Math.max(1, e.atk - Math.floor(mDef(t)/2) + Math.floor(Math.random()*5) - 2);
  if(t.guard) d = Math.max(1, Math.ceil(d*0.4));
  A.cue(); A.ehit();
  V.fx('enemyattack',{target:t, from:e}, ()=>{
    t.hp-=d;
    lines.push(e.dispName+'の こうげき！', t.name+'は '+d+'の ダメージを うけた！'+(t.guard?'（ぼうぎょ）':''));
    if(e.drain){
      const h=Math.min(e.maxhp-e.hp, Math.floor(d*e.drain));
      if(h>0){ e.hp+=h; lines.push(e.dispName+'は HPを '+h+' すいとった！'); }
    }
    if(t.hp<=0){ t.hp=0; t.status=null; lines.push(t.name+'は たおれた…'); }
    else if(e.inflict && Math.random()<inflictP(e) && !t.status){
      t.status=e.inflict.type;
      lines.push(t.name+'は '+statusText(e.inflict.type));
    }
    U.hud(); U.msg(lines, done);
  });
}
// けいたい へんかの れんせん（HP・MPは ひきつぐ）

function victory(){
  const b=G.battle;
  if(A.bgmStop) A.bgmStop();      // しょうりBGMは はいし。せんとうきょくを とめるだけ。
  if(b.named==='desgran1'){
    A.win();
    bossPhase('desgran2', [
      'デスグランの りょううでが、くだけおちた！',
      'デスグラン「うでなど いらぬ……おんねんこそ が わが ちから！」',
      'まおうは おんねんの ほのおに みを ゆだねた！']);
    return;
  }
  if(b.named==='desgran2'){
    A.win();
    bossPhase('desgran3', [
      'デスグランの かたから、むすうの しょくしゅが ふきだした！',
      'はらに きょだいな めと くちが ひらいていく——',
      'デスグラン「これが……まじんの すがた だ！！」']);
    return;
  }
  const got = b.enemies.filter(e=>!e.fled);
  // ★ばしょに よって けいけんちが かわる（かせぎばを つくる）
  const mul = EXP_MUL[P.map] || 1;
  const exp = Math.round(got.reduce((a,e)=>a+e.exp,0) * mul);
  const gold = got.reduce((a,e)=>a+e.gold,0);
  P.gold += gold;
  A.win();
  const lines=['まものたちを たおした！','けいけんち '+exp+'、'+gold+'ゴールドを かくとく！'];
  let leveled=false;
  aliveMembers().concat(reserve.filter(m=>m.hp>0)).forEach(m=>{
    m.exp += exp;
    while(m.exp >= expNext(m)){
      m.exp -= expNext(m); m.lv++; leveled=true;
      const g = CLASSES[m.cls].g;
      m.maxhp+=g.hp; m.maxmp+=g.mp; m.batk+=g.atk; m.bdef+=g.def;
      if(m.lv%2===0) m.agi+=g.agi;
      m.hp=m.maxhp; m.mp=m.maxmp;
      lines.push(m.name+'は レベル'+m.lv+'に あがった！');
      const ns = CLASSES[m.cls].learns.find(l=>l.lv===m.lv);
      if(ns) lines.push(m.name+'は '+SPELL_DEFS[ns.key].name+'を おぼえた！');
    }

const TRADE_GOODS = {
  nuno:   {key:'nuno',   name:'ぬの',          base:20},
  spice:  {key:'spice',  name:'こうしんりょう',  base:60},
  glass:  {key:'glass',  name:'がらすだま',     base:40},
  dates:  {key:'dates',  name:'ほしたなつめ',   base:15},
  silver: {key:'silver', name:'ぎんの かざり',  base:120},
};
// まちごとの そうば（1.0が きじゅん）
const TRADE_MARKET = {
  zaal_town:  {nuno:0.70, spice:1.45, glass:0.75, dates:1.35, silver:1.15},
  zaal_oasis: {nuno:1.50, spice:0.60, glass:1.40, dates:0.65, silver:0.85},
  versa_town: {nuno:1.20, spice:1.30, glass:0.90, dates:1.50, silver:0.80},
  versa_town2:{nuno:0.85, spice:1.20, glass:1.30, dates:1.20, silver:1.10},
};
function tradeTowns(){ return Object.keys(TRADE_MARKET); }
// そうばは まちに はいる たびに すこし ゆれる
function marketSeed(map){
  const t = (G.marketTick|0);
  let h = 0, s = map + ':' + t;
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function tradePrice(map, key){
  const g = TRADE_GOODS[key], mk = TRADE_MARKET[map];
  if(!g || !mk) return null;
  const wave = ((marketSeed(map + key) % 41) - 20) / 100;   // ±20%
  return Math.max(1, Math.round(g.base * mk[key] * (1 + wave)));
}
function sellPrice(map, key){
  const p = tradePrice(map, key);
  return p === null ? null : Math.max(1, Math.round(p * 0.85));
}
function goodsCount(key){ return (P.goods && P.goods[key]) | 0; }
function goodsTotal(){ return Object.values(P.goods || {}).reduce((a,b)=>a+(b|0), 0); }
const GOODS_LIMIT = 30;                       // かつげる かず
function buyGood(map, key, n){
  const p = tradePrice(map, key);
  if(p === null) return {ok:false, msg:'ここでは あつかって いない。'};
  n = Math.max(1, n|0);
  if(goodsTotal() + n > GOODS_LIMIT) return {ok:false, msg:'これいじょうは かつげない。'};
  const cost = p * n;
  if(P.gold < cost) return {ok:false, msg:'ゴールドが たりない。'};
  P.gold -= cost;
  P.goods = P.goods || {};
  P.goods[key] = goodsCount(key) + n;
  return {ok:true, msg:TRADE_GOODS[key].name + 'を ' + n + 'こ しいれた！（' + cost + 'G）', cost};
}
function sellGood(map, key, n){
  const p = sellPrice(map, key);
  if(p === null) return {ok:false, msg:'ここでは ひきとって もらえない。'};
  const have = goodsCount(key);
  if(have <= 0) return {ok:false, msg:'もって いない。'};
  n = Math.min(have, Math.max(1, n|0));
  const gain = p * n;
  P.gold += gain;
  P.goods[key] = have - n;
  if(P.goods[key] <= 0) delete P.goods[key];
  // ★はじめて もうけたら しょうかいちょうが ほめる（ものがたりの めじるし）
  G.tradeProfit = (G.tradeProfit | 0) + gain;
  return {ok:true, msg:TRADE_GOODS[key].name + 'を ' + n + 'こ うった！（' + gain + 'G）', gain};
}

  if(!FIELD_SPELL[sp.type]) return {ok:false, lines:['ここでは つかっても しかたが ない。']};

  const lines = [m.name+'は '+sp.name+'を となえた！'];

    m.mp -= sp.mp;

      x.hp += v;

    if(!t) return {ok:false, lines:['だれに つかう？']};
    if(!t.status) return {ok:false, lines:[t.name+'は なんとも ない。']};
    m.mp -= sp.mp;
    t.status = null;
    lines.push(t.name+'の からだが らくに なった！');

  m.hp = Math.max(0, Math.min(m.maxhp, (o.hp===undefined? m.maxhp : o.hp|0)));
  m.mp = Math.max(0, Math.min(m.maxmp, (o.mp===undefined? m.maxmp : o.mp|0)));
  return m;
}
function safeLanding(map, x, y){
  if(!MAPS[map]) return {map:'versa_town', x:13, y:18};   // マップが きえていたら はじまりへ
  if(walkable(map,x,y)) return {map,x,y};
  for(let r=1;r<=6;r++){                                   // かべの なかなら ちかくへ おしだす
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(walkable(map,x+dx,y+dy)) return {map, x:x+dx, y:y+dy};
    }
  }
  return {map:'versa_town', x:13, y:18};
}

  const st = store(s); if(!st) return false;

    const raw = st.getItem(SAVE_SLOTS[slot||0]);

    d = JSON.parse(raw);
  }catch(e){ lastSaveError='きろくが よめませんでした（データが こわれています）'; return false; }
  try{
    d = migrate(d);
    P.gold = Math.max(0, d.gold|0);
    P.herbs = Math.max(0, d.herbs|0);
    P.waters = Math.max(0, d.waters|0);
    P.equipBag = Array.isArray(d.equipBag) ? d.equipBag : [];
    P.keyItems = (d.keyItems && typeof d.keyItems==='object') ? d.keyItems : {};
    P.goods = (d.goods && typeof d.goods==='object') ? d.goods : {};
    G.marketTick = d.marketTick|0; G.tradeProfit = d.tradeProfit|0;
    G.quota = d.quota || null;
    P.dir = d.dir || 'front';
    G.ship = (d.ship && typeof d.ship.x==='number') ? {x:d.ship.x|0, y:d.ship.y|0} : null;
    // ★うみの うえで きろくして いたら、そのまま ふねの うえに もどす
    if(d.aboard && d.map==='world' && tileAt('world', d.x|0, d.y|0)==='~'){
      G.aboard = true;
      P.map='world'; P.x=d.x|0; P.y=d.y|0;
    }else{
      G.aboard = false;
      const land = safeLanding(d.map, d.x|0, d.y|0);

function switchChapter(no, newParty){

  party.length = 0; reserve.length = 0;

      if(typeof sl === 'number') return sl;
      return sl[k] || 1;

    const inh = cd && cd.inheritParty ? (G.chapters||{})[cd.inheritParty] : null;
    if(inh && inh.party && inh.party.length){

      (inh.reserve||[]).forEach(o=>{ const m=reviveMember(o);
        if(party.length<4) party.push(m); else reserve.push(m); });
      P.gold=inh.gold|0; P.herbs=inh.herbs|0; P.waters=inh.waters|0;
      allMembers().forEach(m=>{ m.hp=m.maxhp; m.mp=m.maxmp; m.status=null; });
    }else{
      cls.forEach((k,i)=>{ const m = mkMember(k, lvOf(k));
        if(i<4) party.push(m); else reserve.push(m); });   // ★せんとうは 4にんまで
    }
    if(cd){
      if(cd.start){
        const land = safeLanding(cd.start.map, cd.start.x|0, cd.start.y|0);
        P.map=land.map; P.x=land.x; P.y=land.y; P.dir=cd.start.dir||'front';
      }
      G.visited = {};                       // ★ほかの しょうの きろくを もちこさない
    G.ship = null; G.aboard = false;      // ★ふねは しょうごと
      if(cd.gold!==undefined)   P.gold   = cd.gold|0;
      if(cd.herbs!==undefined)  P.herbs  = cd.herbs|0;
      if(cd.waters!==undefined) P.waters = cd.waters|0;
      if(cd.equip && party[0]){
        if(cd.equip.weapon) party[0].weapon = Object.assign({}, cd.equip.weapon);
        if(cd.equip.armor)  party[0].armor  = Object.assign({}, cd.equip.armor);
      }
      G.visited[P.map] = true;
    }
  }
  G.trail=[[P.x,P.y],[P.x,P.y]];
  return true;

  if(allMembers().some(m=>m.cls===cls)) return null;

            if(V.setActors) V.setActors(true); U.hud(); return {ok:true}; }

  const w=art[0].length, h=art.length;          // size は「たかさ」。よこは アスペクトで きめる
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size*w/h, size),
    new THREE.MeshBasicMaterial({map:sprCache[key],transparent:true,alphaTest:0.4}));
  m.userData.aspect=w/h;
  return m;
}

// ---- インスタンス描画ヘルパ（drawCallを地形種ごと1つに） ----
function addInstanced(geo, mat, list){
  if(!list.length) return null;
  const im=new THREE.InstancedMesh(geo, mat, list.length);
  const d=new THREE.Object3D();
  list.forEach((p,i)=>{
    d.position.set(p[0],p[1],p[2]);
    if(p[3]!==undefined) d.rotation.y=p[3];
    if(p[4]!==undefined) d.scale.set(p[4],p[5]!==undefined?p[5]:p[4],p[4]);
    else d.scale.set(1,1,1);
    d.updateMatrix(); im.setMatrixAt(i,d.matrix);
  });
  im.instanceMatrix.needsUpdate=true;
  scene.add(im);
  return im;
}

// じかに Mesh を つくらず、かたちごとに いちらんへ ためる（あとで InstancedMesh に まとめる）
// これを しないと 48×36の こういきマップで ドローコールが 6000をこえて iPhoneが やられる
function buildSnowTile(ch,x,y,topY,ts,put){
  if(ch==='T'){                      // あおい せんとう
    put('towerBody',[x,topY+0.75,y]);
    put('towerRoof',[x,topY+2.1,y]);
    put('towerCap', [x,topY+2.72,y]);
    return true;
  }
  if(ch==='K'){                      // おうじょうの もん
    put('gateBody',[x,topY+1.15,y]);
    put('gateArch',[x,topY+1.95,y+0.28]);
    return true;
  }
  if(ch==='F'){                      // ふんすい
    put('fountBase',[x,topY+0.15,y]);
    put((ts&&ts.id==='DREAM_INVASION')?'fountWaterDark':'fountWater',[x,topY+0.32,y]);
    put('fountPole',[x,topY+0.65,y]);
    return true;
  }
  if(ch==='W'||ch==='M'||ch==='I'||ch==='P'){   // みせ・やど・きょうかい
    put('shop_'+ch,[x,topY+0.6,y]);
    put('shopRoof', [x,topY+1.65,y,Math.PI/4]);
    put('shopCap',  [x,topY+2.0,y,Math.PI/4]);
    put('sign_'+ch, [x,topY+0.74,y+0.5]);
    return true;
  }
  if(ch==='G'){                      // みなみもん
    for(const dx of [-0.45,0.45]){
      put('gatePost',[x+dx,topY+0.95,y]);
      put('gateTip', [x+dx,topY+2.05,y]);
    }
    return true;
  }
  if(ch==='f'){                      // ゆきを かぶった き
    put('snowTrunk',[x,topY+0.3,y]);
    for(let k=0;k<3;k++){
      put('snowCone'+k,[x,topY+0.7+k*0.34,y]);
      put('snowCap'+k, [x,topY+0.94+k*0.34,y]);
    }
    return true;
  }
  return false;
}

function auroraTexture(){
  return patTex((x,px)=>{
    const g=x.createLinearGradient(0,0,0,px);
    g.addColorStop(0.00,'rgba(0,0,0,0)');
    g.addColorStop(0.35,'rgba(90,240,180,0.55)');
    g.addColorStop(0.60,'rgba(120,200,255,0.45)');
    g.addColorStop(0.85,'rgba(180,120,255,0.25)');
    g.addColorStop(1.00,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(0,0,px,px);
    for(let i=0;i<26;i++){        // たてに ゆれる すじ
      x.fillStyle='rgba(255,255,255,'+(0.05+Math.random()*0.12)+')';
      x.fillRect(Math.random()*px|0,0,2+Math.random()*3|0,px);
    }
  },128);
}
function buildAurora(){
  aurora=new THREE.Group();
  const tex=auroraTexture();
  tex.wrapS=THREE.RepeatWrapping; tex.repeat.set(3,1);
  for(let i=0;i<3;i++){
    const geo=new THREE.PlaneGeometry(46,10,24,1);
    const p=geo.attributes.position;
    for(let k=0;k<p.count;k++){    // ゆるやかに うねらせる
      const xx=p.getX(k);
      p.setZ(k, Math.sin(xx*0.22+i)*2.4);
    }
    geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex.clone(),
      transparent:true, opacity:0.5-i*0.11, blending:THREE.AdditiveBlending,
      depthWrite:false, side:THREE.DoubleSide}));
    m.material.map.wrapS=THREE.RepeatWrapping; m.material.map.repeat.set(3,1);
    m.position.set(0, 13+i*2.2, -16-i*4);
    m.rotation.x=-0.34;
    aurora.add(m);
  }
  scene.add(aurora);
}

function initFootprints(){
  footprints=[]; footIdx=0; lastFootTile=null;
  const geo=new THREE.PlaneGeometry(0.34,0.5);
  for(let i=0;i<48;i++){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x9fb0c8,
      transparent:true, opacity:0, depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.position.set(0,-99,0);
    scene.add(m); footprints.push({mesh:m, life:0});
  }
}
function dropFootprint(x,z,side){
  if(!footprints.length) return;
  const f=footprints[footIdx%footprints.length]; footIdx++;
  f.mesh.position.set(x+(side?0.16:-0.16), 0.075, z+0.1);
  f.mesh.rotation.z=(Math.random()-0.5)*0.3;
  f.life=1.0;
}
function disposeScene(s){
  if(!s) return;
  s.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      const ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(m=>{ if(m.map && m.map.isCanvasTexture && m.map.__clone) m.map.dispose(); m.dispose(); });
    }
  });
}
// だんさの ある ちけい（どうくつ・こおりの どうくつ）かどうか
function isElevated(mapName){
  const m=C.MAPS[mapName];
  return !!m && (m.theme==='cave' || m.theme==='ice');
}
function darken(hex,k){
  const r=((hex>>16)&255)*k, g=((hex>>8)&255)*k, b=(hex&255)*k;
  return ((r|0)<<16)|((g|0)<<8)|(b|0);
}
function buildMap(name){
  // しろの なか だけ 3D。それ いがいは ドットえ（2D）で えがく
  const mode = (C.WORLD && C.WORLD.renderModeOf) ? C.WORLD.renderModeOf(name) : '2d';
  is2D = (mode==='2d');
  if(canvas2d) canvas2d.style.display = is2D ? 'block' : 'none';
  if(canvas) canvas.style.visibility = is2D ? 'hidden' : 'visible';
  if(is2D){
    curMap = name;
    if(V2){ V2.resize(); V2.buildMap(name); }
    setActors(true);
    return;
  }
  disposeScene(scene);
  const map=C.MAPS[name];
  const th=THEME[map.theme]||THEME.field;
  const sc=(C.WORLD&&C.WORLD.sceneOf)?C.WORLD.sceneOf(name):{};
  const ts=(C.townStateDef?C.townStateDef():null);
  const night=!!(C.G&&C.G.night)&&!!sc.outdoor;
  scene=new THREE.Scene();
  let sky=th.sky, fog=[th.fog[0], th.fog[1]*1.5, th.fog[2]*1.6];
  if(map.theme==='snow' && ts){ sky=ts.sky; fog=[ts.fog[0], ts.fog[1]*1.5, ts.fog[2]*1.6]; }
  if(night){ sky=darken(sky,0.34); fog=[darken(fog[0],0.42), fog[1]*0.85, fog[2]*0.9]; }
  scene.background=new THREE.Color(sky);
  scene.fog=new THREE.Fog(fog[0],fog[1],fog[2]);
  curScene=sc; curNight=night; curTS=ts;
  animObjs=[]; waters=[]; chestLids={};
  curMap=name;

  const rows=map.tiles, H=rows.length, W=rows[0].length;
  const cave = map.theme==='cave' || map.theme==='ice';
  const dream = map.theme==='dream';
  const snow = map.theme==='snow';
  const ice  = map.theme==='ice';
  const cast = map.theme==='castle';
  const baseY = cave?0.25:-0.06;     // 洞窟は台地
  const topY  = cave?0.5:0;
  const G_={}, put=(k,v)=>{ (G_[k]=G_[k]||[]).push(v); };

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const ch=rows[y][x];
    if(ch==='w'){                    // みず
      put('waterbed',[x,baseY-0.24,y]);
      const wm=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
        new THREE.MeshBasicMaterial({map:TEX.water.clone(),transparent:true,opacity:0.86}));
      wm.material.map.wrapS=wm.material.map.wrapT=THREE.RepeatWrapping;
      wm.rotation.x=-Math.PI/2; wm.position.set(x,topY-0.14,y);
      scene.add(wm); waters.push(wm);
      continue;
    }
    if(ch==='#'){                    // かべ／がんぺき
      if(cave){
        const h=2.2+((x*7+y*13)%5)*0.45;
        put('cliff',[x,h/2,y,0,1,h]);
        put('spike',[x+(((x+y)%3)-1)*0.18,h+0.27,y,(x*3+y)*0.7]);
      }else{
        put('wall',[x,0.8,y]);
      }
      continue;
    }
    // ゆか
    put(ch==='r'?'road':'ground',[x,baseY,y]);
    if(snow && buildSnowTile(ch,x,y,topY,ts,put)) continue;
    if(ice){
      if(ch==='o'){ put('icePillar',[x,topY+0.6,y]); continue; }
      if(ch==='C'||ch==='B'||ch==='t'||ch==='G'||ch==='<'||ch==='>'){ /* 既存処理へ */ }

    if(cast){
      if(ch==='T'){                                  // はしら（だいざ・みぞ・かしらつき）

      if(ch==='#'){                                  // かべ：まどと たれまくを かざる

    }
    if(ch==='f'){                    // もり

      const sh=new THREE.Mesh(new THREE.CircleGeometry(0.30,12),
        new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.28,depthWrite:false}));
      sh.rotation.x=-Math.PI/2; sh.position.set(x, topY+0.045, y);
      scene.add(sh);                                  // あしもとの かげ
    }
    if(ch==='t'){                    // たいまつ（かべぎわに よせる）
      let ox=0,oz=0;
      if(C.isBlocked(C.tileAt(name,x-1,y))) ox=-0.38;
      else if(C.isBlocked(C.tileAt(name,x+1,y))) ox=0.38;
      else if(C.isBlocked(C.tileAt(name,x,y-1))) oz=-0.38;
      else oz=0.38;
      const pole=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.8,0.08),

      fire.position.set(x+ox,topY+0.86,y+oz); scene.add(fire);

      const lid=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.2,0.46),

      const band=new THREE.Mesh(new THREE.BoxGeometry(0.64,0.08,0.48),
        new THREE.MeshBasicMaterial({color:0xd9a832}));
      band.position.set(x,topY+0.3,y); scene.add(band);
      chestLids[x+','+y]=lid;
      if(got){ lid.rotation.x=-0.9; lid.position.y=topY+0.5; }
    }
    if(ch==='B'){                    // ボス（さいおくの けはい）
      if(!C.G.flags.desgran){

        animObjs.push({mesh:s,bill:true,ph:1});

          new THREE.MeshLambertMaterial({map:TEX.rock,color:0xbbbbbb}));

  if(dream) gm.color.setHex(0xc9b2f2);   // ★ゆめのたいりく：あわい むらさきの ゆか
  if(snow && ts && ts.id!=='NORMAL') gm.color.setHex(ts.snowColor);
  addInstanced(box,gm, (G_.ground||[]).map(p=>[p[0],p[1],p[2]]));
  addInstanced(box,new THREE.MeshLambertMaterial({
      map: snow?TEX.pave : ice?TEX.ice : cast?TEX.carpet : TEX.road}),
    (G_.road||[]).map(p=>[p[0],p[1],p[2]]));
  if(cave){
    addInstanced(new THREE.BoxGeometry(1,0.5,1),
      new THREE.MeshLambertMaterial({map: ice?TEX.ice:TEX.rock}),
      (G_.ground||[]).concat(G_.road||[]).map(p=>[p[0],0.25,p[2]]));
    addInstanced(new THREE.BoxGeometry(1,1,1),
      new THREE.MeshLambertMaterial({map: ice?TEX.icewall:TEX.cliff}),
      (G_.cliff||[]).map(p=>[p[0],p[1],p[2],0,1,p[5]]));
    addInstanced(new THREE.ConeGeometry(0.42,0.55,5),new THREE.MeshLambertMaterial({color:0x2c3448}),
      G_.spike||[]);
  }else{
    addInstanced(new THREE.BoxGeometry(1,1.6,1),
      new THREE.MeshLambertMaterial({map:snow?TEX.whitestone:TEX.brick}),
      (G_.wall||[]).map(p=>[p[0],p[1],p[2]]));
    if(snow) addInstanced(new THREE.BoxGeometry(1.04,0.18,1.04),
      new THREE.MeshBasicMaterial({color:0xf4f9ff}),
      (G_.wall||[]).map(p=>[p[0],p[1]+0.82,p[2]]));
  }
  addInstanced(new THREE.IcosahedronGeometry(0.44,0),
    new THREE.MeshLambertMaterial({color:0x2c7a34,flatShading:true}), G_.leafA||[]);
  addInstanced(new THREE.IcosahedronGeometry(0.3,0),
    new THREE.MeshLambertMaterial({color:0x1e5c28,flatShading:true}), G_.leafB||[]);
  addInstanced(new THREE.DodecahedronGeometry(0.42,0),
    new THREE.MeshLambertMaterial({color:0x8a8f9c,flatShading:true}), G_.rock||[]);
  addInstanced(box,new THREE.MeshLambertMaterial({color:0x0d2c50}), (G_.waterbed||[]).map(p=>[p[0],p[1],p[2]]));
  // ゆきぐにの たてもの・せんとう・きを かたちごとに まとめて 1ドローコールへ
  if(ice||cast){
    const wh=()=>new THREE.MeshLambertMaterial({map:TEX.whitestone});
    const S2={
      icePillar:[new THREE.ConeGeometry(0.34,1.2,6),
        new THREE.MeshLambertMaterial({map:TEX.ice,transparent:true,opacity:0.9})],
      castPillar:[new THREE.CylinderGeometry(0.26,0.30,1.9,10), wh()],
      pillarBase:[new THREE.CylinderGeometry(0.38,0.42,0.2,10), wh()],
      pillarCap:[new THREE.CylinderGeometry(0.40,0.34,0.16,10),
        new THREE.MeshLambertMaterial({color:0xd8c48a})],
      throneSeat:[new THREE.BoxGeometry(0.74,0.24,0.66),
        new THREE.MeshLambertMaterial({color:0x8a2a30})],
      throneBack:[new THREE.BoxGeometry(0.74,1.30,0.16),
        new THREE.MeshLambertMaterial({color:0x6e2028})],
      throneGold:[new THREE.BoxGeometry(0.82,0.14,0.22),
        new THREE.MeshLambertMaterial({color:0xd8b040})],
      bedFrame:[new THREE.BoxGeometry(0.90,0.24,1.02),
        new THREE.MeshLambertMaterial({map:TEX.wood})],
      bedSheet:[new THREE.BoxGeometry(0.84,0.14,0.96),
        new THREE.MeshLambertMaterial({color:0xeef0fa})],
      bedPillow:[new THREE.BoxGeometry(0.52,0.12,0.28),
        new THREE.MeshLambertMaterial({color:0xdcd0f0})],
      castWindow:[new THREE.PlaneGeometry(0.52,0.86),
        new THREE.MeshBasicMaterial({color:0x2f5f96})],
      banner:[new THREE.PlaneGeometry(0.42,1.05),
        new THREE.MeshBasicMaterial({color:0x8a2a30})],
      wallTorch:[new THREE.SphereGeometry(0.11,7,7),
        new THREE.MeshBasicMaterial({color:0xffa838})],
      castDoor:[new THREE.BoxGeometry(0.8,1.0,0.2),
        new THREE.MeshLambertMaterial({map:TEX.wood})],
    };
    Object.keys(S2).forEach(k=>{
      const list=G_[k]; if(!list||!list.length) return;
      addInstanced(S2[k][0], S2[k][1], list);
    });
  }
  if(snow){
    const S=snowShapes();
    Object.keys(S).forEach(k=>{
      const list=G_[k];
      if(!list||!list.length) return;
      addInstanced(S[k][0], S[k][1], list);
    });
  }
  drawCalls = countDrawCalls();

  let ambCol=th.amb[0], ambPow=th.amb[1];
  if(snow && ts){ ambCol=ts.ambient[0]; ambPow=ts.ambient[1]; }
  if(night){ ambCol=darken(ambCol,0.45); ambPow*=0.62; }
  scene.add(new THREE.AmbientLight(ambCol,ambPow));
  const sun=new THREE.DirectionalLight(night?0x8fa8d8:th.sun[0], night?0.30:th.sun[1]);
  sun.position.set(5,10,4); scene.add(sun);
  snowfall=null; aurora=null; footprints=[]; footIdx=0;

  if(sc.aurora && night) buildAurora();
  if(sc.footprints) initFootprints();

  // 隊列アクター（パーティ人数ぶんだけ つくる）
  actors.list=[];
  C.party.forEach((m,i)=>{

                         : billboard(m.cls, i===0?1.25:1.20);
    scene.add(b); actors.list.push(b);
  });
  actors.hero=actors.list[0]||null;
  if(cave){
    const lamp=new THREE.PointLight(ice?0xbfe4ff:0xffd090,1.0,4.5); scene.add(lamp); actors.lamp=lamp;
  }else actors.lamp=null;
  setActors(true);
}
let fpMap = null;                     // fp が どの マップの ざひょうか
function setActors(snap){
  const P=C.P, tr=C.G.trail;
  // ★マップが かわったら かならず いちを あわせる。
  //   のこったままだと まえの マップの ざひょうで えがかれ、
  //   がめんの そとに いって すがたが きえる。
  if(fpMap !== P.map){ fpMap = P.map; snap = true; }
  if(is2D){
    if(V2) V2.noteStep(P.x, P.y, !!C.G.stepFlip);
  }else if(curScene && curScene.footprints && !isElevated(curMap)){
    const key=P.x+','+P.y;
    if(key!==lastFootTile){ lastFootTile=key; dropFootprint(P.x,P.y,!!C.G.stepFlip); }
  }
  const yy = isElevated(curMap) ? 1.22 : 0.72;   // だんさの うえに たつ
  // ★2Dでは 3Dの アクターを つくらない ので、actors.list が からに なる。
  //   にんずうを パーティから とる（そうしないと たいれつが つねに 1にんぶん になる）。
  const n = is2D ? C.party.length
                 : (actors.list ? actors.list.length : 1);
  const tgt=[];
  for(let i=0;i<n;i++){
    const t=(i===0)?[P.x,P.y]:(tr[i-1]||[P.x,P.y]);
    tgt.push(t);
  }
  if(snap || fp.length!==n) fp=tgt.map(t=>({x:t[0],y:t[1]}));
  fp._tgt=tgt; fp._y=yy;
}

let foes=[];
function buildBattleScene(){
  batScene=new THREE.Scene();
  batScene.background=new THREE.Color(0x070512);
  batScene.fog=new THREE.Fog(0x070512,8,30);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(30,30),
    new THREE.MeshLambertMaterial({map:TEX.battleFloor}));
  g.rotation.x=-Math.PI/2; batScene.add(g);
  for(let i=0;i<14;i++){
    const a=(i/14)*Math.PI+Math.PI;
    const h=2.5+((i*5)%4)*0.9;
    const p=new THREE.Mesh(new THREE.ConeGeometry(0.7,h,5),
      new THREE.MeshLambertMaterial({color:i%3?0x3a4a80:0x4a5c9c}));
    p.position.set(Math.cos(a)*8.5,h/2,Math.sin(a)*8.5-2);
    p.rotation.y=(i*17)%6; batScene.add(p);
  }
  for(let i=0;i<40;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.035,4,4),
      new THREE.MeshBasicMaterial({color:0xffffff}));
    s.position.set((Math.random()-0.5)*36,6+Math.random()*9,(Math.random()-0.5)*24-6);
    batScene.add(s);
  }
  batScene.add(new THREE.AmbientLight(0x8899bb,0.9));
  const key=new THREE.PointLight(0xb0c8ff,1.0,26); key.position.set(3,6,5); batScene.add(key);
}
function showBattleCanvas(on){
  // せんとうも ドットえ（2D）で えがく。3Dは しろの なかの フィールドだけ。
  if(canvas2d) canvas2d.style.display = on ? 'block' : (is2D ? 'block' : 'none');
  if(canvas)   canvas.style.visibility = on ? 'hidden' : (is2D ? 'hidden' : 'visible');
}
function battleEnter(enemies, done){
  showBattleCanvas(true);
  mode='battle';
  if(V2 && V2.battleEnter){ V2.resize(); V2.battleEnter(enemies, MON, done); return; }
  foes.forEach(f=>{ batScene.remove(f.mesh); if(f.shadow) batScene.remove(f.shadow); });
  foes=[];
  const n=enemies.length;
  enemies.forEach((e,i)=>{
    const size = MON_SIZE[e.key] || 2.3;
    let key = e.key;
    if(!MON[key] && !SPR[key]){
      console.warn('[view] まものの えが ありません: '+key);
      key = MON.icicleslime ? 'icicleslime' : 'sora';
    }
    const m=billboard(key, size);
    const spread = n===1?0:(i-(n-1)/2)*2.6;
    m.position.set(spread, size*0.5, -3.2 - (i%2)*0.6);
    batScene.add(m);
    // せっちえい（そこに いる かんじを つくる）
    const shd=new THREE.Mesh(new THREE.CircleGeometry(size*0.40,18),
      new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.36,depthWrite:false}));
    shd.rotation.x=-Math.PI/2;
    shd.position.set(m.position.x, 0.02, m.position.z+0.1);
    shd.scale.set(1,0.62,1);
    batScene.add(shd);
    foes.push({mesh:m, shadow:shd, enemy:e, base:m.position.clone(), size, ph:Math.random()*6});
  });
  mode='battle';
  fxState={kind:'enter', t:0, done};
}
function battleLeave(done){
  const fin = ()=>{ mode='field'; showBattleCanvas(false); if(done) done(); };
  if(V2 && V2.battleLeave){ V2.battleLeave(fin); return; }
  fxState={kind:'leave', t:0, done:fin};
}
function fx(kind, data, done){
  if(mode==='battle' && V2 && V2.battleFx){ V2.battleFx(kind, data, done); return; }
  // 演出は短く。完了時に done() を呼ぶ
  if(kind==='attack'||kind==='spell'||kind==='spellall'){
    fxState={kind:'pattack', t:0, done, target:data.target};
  }else if(kind==='enemyattack'||kind==='enemyaoe'){
    // こうげきしてくる 1たいだけを うごかす（ぜんいんが せまってこないように）
    const actor = data && data.from ? foes.find(f=>f.enemy===data.from) : null;
    fxState={kind:'eattack', t:0, done, actor, wide:(kind==='enemyaoe')};
  }else if(kind==='heal'){
    fxState={kind:'heal', t:0, done};
  }else{ done&&done(); }
}
function flash(v){
  const f=document.getElementById('flash');
  f.style.transition='none'; f.style.opacity=v;
  requestAnimationFrame(()=>{ f.style.transition='opacity 0.25s'; f.style.opacity=0; });
}
// ---------------- しょうタイトルカード ----------------
function chapterCard(title, sub, done){
  const el=document.getElementById('chapter');
  if(!el){ if(done) done(); return; }
  el.innerHTML='<div class="ct">'+title+'</div><div class="cs">'+(sub||'')+'</div>';
  el.classList.add('show');
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>{ if(done) done(); }, 700);
  }, 2400);
}
function fade(to, done){
  const f=document.getElementById('fade');
  f.style.transition='opacity 0.3s'; f.style.opacity=to;
  if(V2) V2.setFade(0);          // DOMがわの おおいで じゅうぶん
  setTimeout(()=>done&&done(), 330);
}

// ---------------- ループ ----------------
let last=performance.now();
function loop(now){
  const dt=Math.max(0, Math.min(0.05,(now-last)/1000)); last=now;   // まきもどりでも とまらない
  const time=now/1000;
  if(mode==='battle'){
    if(V2 && V2.drawBattle) V2.drawBattle(dt,time);
    else updateBattle(dt,time);
  }
  else if(is2D) update2D(dt,time);
  else updateField(dt,time);
  requestAnimationFrame(loop);
}
// ---------------- 2D（ドットえ）の こうしん ----------------
function update2D(dt,time){
  if(!V2) return;
  // ★えがく まえに かならず そろえる。
  //   fp（ひょうじいち）が たりないと だれも えがかれず、
  //   マップだけ みえて しゅじんこうが きえる（じっさいに おきた）。
  const need = C.party.length;
  if(fp.length !== need || !fp._tgt || fp._tgt.length !== need){
    const tr = C.G.trail || [];
    const rebuilt = [];
    for(let i=0;i<need;i++){
      const t = (i===0) ? [C.P.x, C.P.y] : (tr[i-1] || [C.P.x, C.P.y]);
      rebuilt.push(t);
    }
    fp = rebuilt.map(t=>({x:t[0], y:t[1]}));
    fp._tgt = rebuilt;
    fp._y = isElevated(curMap) ? 1.22 : 0.72;
  }
  const tgt=fp._tgt||[[C.P.x,C.P.y]];
  const objs=[];
  C.party.forEach((m,i)=>{
    if(!fp[i]||!tgt[i]) return;
    fp[i].x += (tgt[i][0]-fp[i].x)*Math.min(1,dt*8);
    fp[i].y += (tgt[i][1]-fp[i].y)*Math.min(1,dt*8);
    let dir=C.P.dir||'front';
    if(i>0 && tgt[i-1]){
      const dx=tgt[i-1][0]-tgt[i][0], dy=tgt[i-1][1]-tgt[i][1];
      if(dx||dy) dir = dy<0?'back' : dy>0?'front' : (dx<0?'left':'right');
    }
    const dist=Math.abs(tgt[i][0]-fp[i].x)+Math.abs(tgt[i][1]-fp[i].y);
    const moving=dist>0.06;
    const pf=poseOf(m.cls, dir, moving && C.G.stepFlip);
    const t=1-Math.min(1,dist);
    objs.push({x:fp[i].x, y:fp[i].y, cls:m.cls, pose:pf.pose, flip:pf.flip,
               bob: moving ? -Math.abs(Math.sin(t*Math.PI))*0.06 : 0});
  });
  lastPoses2D = objs.map(o=>o.pose);
  V2.draw(dt, time, objs);
}
function updateField(dt,time){
  if(!scene) return;
  const objs=actors.list||[];
  if(!objs.length) { renderer.render(scene,cam); return; }
  const tgt=fp._tgt||objs.map(()=>[C.P.x,C.P.y]);
  const yy=fp._y||0.45;
  for(let i=0;i<objs.length;i++){
    if(!objs[i]||!tgt[i]||!fp[i]) continue;
    fp[i].x += (tgt[i][0]-fp[i].x)*Math.min(1,dt*8);
    fp[i].y += (tgt[i][1]-fp[i].y)*Math.min(1,dt*8);
    objs[i].position.set(fp[i].x, yy+(i===0?Math.abs(Math.sin(time*7))*0.02:0), fp[i].y);
    objs[i].quaternion.copy(cam.quaternion);
    const key=objs[i].userData.chr;
    if(key){
      // せんとうは じぶんの むき、なかまは まえの ひとを おいかける むき
      let dir=C.P.dir||'front';
      if(i>0 && tgt[i-1] && tgt[i]){
        const dx=tgt[i-1][0]-tgt[i][0], dy=tgt[i-1][1]-tgt[i][1];
        if(dx||dy) dir = dy<0?'back' : dy>0?'front' : (dx<0?'left':'right');
      }
      // まだ めもりに ついていない ＝ あるいている とちゅう
      const dist=Math.abs(tgt[i][0]-fp[i].x)+Math.abs(tgt[i][1]-fp[i].y);
      const moving = dist>0.06;
      const pf=poseOf(key, dir, moving && C.G.stepFlip);   // ますごとに あしが かわる
      if(objs[i].userData.pose!==pf.pose){
        objs[i].material.map=chrTex(key,pf.pose);
        objs[i].material.needsUpdate=true;
        objs[i].userData.pose=pf.pose;
      }
      objs[i].scale.x = pf.flip?-1:1;
      objs[i].scale.y = 1;
      // あるく はずみ：ふみだす たびに すこし しずんで もどる
      if(moving){
        const t=1-Math.min(1,dist);                       // 0→1 で 1ますぶん
        objs[i].position.y += Math.abs(Math.sin(t*Math.PI))*0.045;
      }
    }else{
      objs[i].scale.x = (C.G.stepFlip ? (i%2?-1:1) : (i%2?1:-1));
    }
  }
  if(actors.lamp) actors.lamp.position.set(fp[0].x,yy+0.6,fp[0].y);
  const cx=fp[0].x, cz=fp[0].y+7.2;
  cam.position.lerp(new THREE.Vector3(cx,14.2,cz),Math.min(1,dt*6));   // ひいた しかく
  cam.lookAt(fp[0].x,0.2,fp[0].y-0.9);
  animObjs.forEach(o=>{
    if(o.bill){ o.mesh.quaternion.copy(cam.quaternion); return; }
    o.mesh.scale.setScalar(1+Math.sin(time*9+o.ph)*0.2);
    if(o.light) o.light.intensity=1.2+Math.sin(time*10+o.ph)*0.3;
  });
  waters.forEach((w,i)=>{ w.material.map.offset.x=time*0.04+i*0.11;
    w.material.map.offset.y=Math.sin(time*0.6+i)*0.03; });
  // せきせつ：カメラの まわりに ふらせ、したまで おちたら うえへ もどす
  if(snowfall){
    const p=snowfall.geometry.attributes.position;
    const rate=snowfall.userData.rate||1;
    for(let i=0;i<p.count;i++){
      let yy=p.getY(i)-dt*(1.1+((i%7)*0.16))*rate;
      let xx=p.getX(i)+Math.sin(time*0.7+i)*dt*0.5;
      if(yy<0){ yy=15+Math.random()*3; xx=(Math.random()-0.5)*34; p.setZ(i,(Math.random()-0.5)*34); }
      p.setY(i,yy); p.setX(i,xx);
    }
    p.needsUpdate=true;
    snowfall.position.set(fp[0].x,0,fp[0].y);
  }
  // オーロラ：ゆっくり ながれ、あかるさが ゆらぐ
  if(aurora){
    aurora.position.set(fp[0].x,0,fp[0].y-4);
    aurora.children.forEach((m,i)=>{
      m.material.map.offset.x = time*(0.012+i*0.006);
      m.material.opacity = (0.5-i*0.11)*(0.72+0.28*Math.sin(time*0.5+i*1.3));
    });
  }
  // あしあと：じかんで うすくなる
  footprints.forEach(f=>{
    if(f.life>0){ f.life-=dt*0.055; f.mesh.material.opacity=Math.max(0,f.life)*0.5;
      if(f.life<=0) f.mesh.position.y=-99; }
  });
  renderer.render(scene,cam);
}
function updateBattle(dt,time){
  let cx=0, cy=1.6, cz=6.0, lx=0, ly=1.2, lz=-3;
  const s=fxState;
  if(s){
    s.t+=dt;
    if(s.kind==='enter'){
      const k=Math.min(1,s.t/0.9), e=1-Math.pow(1-k,3);
      cx=(1-e)*5.0; cy=1.6+(1-e)*0.9; cz=6.0+(1-e)*1.6;
      if(s.t>0.95){ const d=s.done; fxState=null; d&&d(); }
    }else if(s.kind==='pattack'){
      if(s.t<0.18) cz=6.0-s.t*8;
      else if(s.t<0.26){ if(!s.hit){ s.hit=true; shake=0.28; flash(0.45); spawnBurst(s.target); } cz=4.6; }
      else if(s.t<0.6) cz=4.6+(s.t-0.26)*4;
      else { const d=s.done; fxState=null; d&&d(); }
    }else if(s.kind==='eattack'){
      const A=s.actor;
      const move=(z)=>{ if(A) A.mesh.position.z=z; };
      const reach=s.wide?0.7:1.1;                       // ぜんたいわざは おおきく ふみこまない
      if(s.t<0.22){ move((A?A.base.z:0)+s.t*(reach/0.22)); }
      else if(s.t<0.3){ if(!s.hit){ s.hit=true; shake=s.wide?0.38:0.3; flash(s.wide?0.4:0.3); } }
      else if(s.t<0.6){ move((A?A.base.z:0)+reach-(s.t-0.3)*(reach/0.3)); }
      else { if(A) A.mesh.position.z=A.base.z; const d=s.done; fxState=null; d&&d(); }
    }else if(s.kind==='heal'){
      if(s.t>0.3){ const d=s.done; fxState=null; d&&d(); }
    }else if(s.kind==='leave'){
      if(s.t>0.2){ mode='field'; const d=s.done; fxState=null; d&&d(); return; }
    }
  }
  // いきづかい：こきゅう・ゆらぎ・まばたき・せっちえい
  foes.forEach(f=>{
    f.mesh.quaternion.copy(batCam.quaternion);
    if(f.enemy.hp<=0){
      f.mesh.material.transparent=true;
      f.mesh.material.opacity=Math.max(0,f.mesh.material.opacity-dt*2.2);
      f.mesh.position.y += dt*0.5;
      if(f.shadow) f.shadow.material.opacity=Math.max(0,f.shadow.material.opacity-dt*1.6);
      return;
    }
    const br=1+Math.sin(time*2.1+f.ph)*0.035;               // こきゅう
    f.mesh.scale.set(br,2-br,1);
    const sway=Math.sin(time*0.85+f.ph)*0.05;               // からだの ゆらぎ
    f.mesh.position.x=f.base.x+sway;
    f.mesh.position.y=f.base.y+Math.sin(time*1.7+f.ph)*0.03;
    // えんしゅつちゅうの 1たいは z を うごかしているので さわらない
    if(!(fxState && fxState.kind==='eattack' && fxState.actor===f)) f.mesh.position.z=f.base.z;
    if(f.shadow){
      f.shadow.position.x=f.mesh.position.x;
      const k=1+Math.sin(time*2.1+f.ph)*0.04;
      f.shadow.scale.set(k,0.62*k,1);
    }
  });
  parts=parts.filter(p=>{
    p.userData.life-=dt;
    if(p.userData.life<=0){ batScene.remove(p); return false; }
    p.userData.v.y-=dt*9;
    p.position.addScaledVector(p.userData.v,dt);
    return true;
  });
  if(shake>0){ shake-=dt; cx+=(Math.random()-0.5)*shake*1.5; cy+=(Math.random()-0.5)*shake*1.5; }
  batCam.position.set(cx,cy,cz);
  batCam.lookAt(lx,ly,lz);
  renderer.render(batScene,batCam);
}
let parts=[];
function spawnBurst(target){
  const f = target && foes.find(x=>x.enemy===target);
  const pos = f? f.mesh.position : new THREE.Vector3(0,1.4,-3);
  for(let i=0;i<14;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),
      new THREE.MeshBasicMaterial({color:i%2?0xffd060:0xff6040}));
    p.position.copy(pos);
    p.userData.v=new THREE.Vector3((Math.random()-0.5)*4,Math.random()*4,(Math.random()-0.5)*4);
    p.userData.life=0.65;
    batScene.add(p); parts.push(p);
  }
}

window.LQ3View = {
  init, loop, buildMap, setActors, fx, battleEnter, battleLeave, refresh, chest, fade, chapterCard,
  showMap(id){ if(V2&&V2.showMap) V2.showMap(id); },
  setDream(on){ if(V2&&V2.setDream) V2.setDream(on); },
  debugSnow(){ return V2&&V2.debugSnow ? V2.debugSnow() : null; },
  hideMap(){ if(V2&&V2.hideMap) V2.hideMap(); },
  get mode(){return mode;}, get drawCalls(){return drawCalls;}, get is2D(){return is2D;},
  debugPoses(){ return is2D ? lastPoses2D.slice()
                           : (actors.list||[]).map(o=>o.userData.pose).filter(Boolean); },
};
})();

<script>'use strict';
// ============================================================
// ルミナクエストIII / UI層・音層・入力・起動
// ============================================================
(function(){
const C = LQ3, V = window.LQ3View;

// ---------------- 音 ----------------
// マップの しゅべつ（town/in/cast/field/dgn）で きょくを えらぶ。
// テーマでは 「まち」と 「のはら」を みわけられない ため。
function trackFor(mapId){
  const info = (typeof WORLD!=='undefined' && WORLD.MAP_IDS) ? WORLD.MAP_IDS[mapId] : null;
  const kind = info ? info.kind : '';
  if(kind==='cast') return 'castle';
  if(kind==='town' || kind==='in') return 'town';
  if(kind==='dgn') return 'dungeon';        // ★どうくつ・いせき・いわば
  return 'field';
}
let AC=null;
function ctx(){
  try{
    if(!AC){
      AC = new (window.AudioContext||window.webkitAudioContext)();
      if(typeof BGM!=='undefined' && BGM.attach) BGM.attach(AC);   // BGMと きょうゆう
    }
  }catch(e){}
  return AC;
}
let SFXBUS=null;
function sfxBus(){                 // こうかおんは まとめて すこし おおきく
  const ac=ctx(); if(!ac) return null;
  if(!SFXBUS){
    try{ SFXBUS=ac.createGain(); SFXBUS.gain.value=1.6; SFXBUS.connect(ac.destination); }
    catch(e){ SFXBUS=null; }
  }
  return SFXBUS;
}
// ============================================================
// こうかおん（DQふう）
//  ・とうは くけい／さんかくは の たんじゅんな はっしんき
//  ・「あたる」おとは ノイズ＋ひくい ドスン
//  ・じゅもんは アルペジオ、レベルアップは のぼる ファンファーレ
// ============================================================
let NOISEBUF=null;
function noiseBuf(){
  const ac=ctx(); if(!ac) return null;
  if(!NOISEBUF){
    const n=Math.floor(ac.sampleRate*0.5);
    NOISEBUF=ac.createBuffer(1,n,ac.sampleRate);
    const d=NOISEBUF.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }
  return NOISEBUF;
}
// たんおん（しゅうはすうを うごかせる）
function tone(f,d,type,v,w,f2){
  const ac=ctx(); if(!ac) return;
  const t0=ac.currentTime+(w||0);
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+d);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v,t0+0.004);      // すばやい たちあがり
  g.gain.exponentialRampToValueAtTime(0.0008,t0+d);
  o.connect(g); g.connect(sfxBus()||ac.destination);
  o.start(t0); o.stop(t0+d+0.02);
}
// ノイズ（あたる おと・ばくはつ）
function noise(d,v,w,hp,lp){
  const ac=ctx(); if(!ac) return;
  const b=noiseBuf(); if(!b) return;
  const t0=ac.currentTime+(w||0);
  const s=ac.createBufferSource(); s.buffer=b;
  const g=ac.createGain();
  let node=s;
  if(hp){ const f=ac.createBiquadFilter(); f.type='highpass';
          f.frequency.setValueAtTime(hp,t0); node.connect(f); node=f; }
  if(lp){ const f=ac.createBiquadFilter(); f.type='lowpass';
          f.frequency.setValueAtTime(lp,t0);
          f.frequency.exponentialRampToValueAtTime(Math.max(200,lp*0.25),t0+d);
          node.connect(f); node=f; }
  g.gain.setValueAtTime(v,t0);
  g.gain.exponentialRampToValueAtTime(0.0008,t0+d);
  node.connect(g); g.connect(sfxBus()||ac.destination);
  s.start(t0); s.stop(t0+d+0.02);
}
// アルペジオ（じゅもん・レベルアップ）
function arp(freqs, step, dur, type, v, w){
  freqs.forEach((f,i)=>tone(f,dur,type,v,(w||0)+i*step));
}
const A = {
  // ---- メニュー ----
  cursor(){ tone(880,0.05,'square',0.05); },              // カーソルいどう
  ok(){     tone(880,0.05,'square',0.06);
            tone(1319,0.09,'square',0.055,0.045); },      // けってい（2おん のぼり）
  cancel(){ tone(660,0.06,'square',0.05);
            tone(440,0.09,'square',0.045,0.05); },        // とりけし（さがり）
  // ---- フィールド ----
  cue(){    tone(523,0.06,'square',0.05);
            tone(784,0.08,'square',0.045,0.05); },        // はなす・しらべる
  door(){   tone(392,0.07,'square',0.05);
            tone(523,0.07,'square',0.05,0.06);
            noise(0.10,0.05,0,900,3000); },               // とびら・かいだん
  chest(){  arp([523,659,784,1047],0.055,0.13,'square',0.055);
            tone(1568,0.22,'triangle',0.05,0.24); },      // たからばこ
  item(){   tone(784,0.08,'triangle',0.06);
            tone(1047,0.12,'triangle',0.05,0.07); },      // どうぐを つかう
  buy(){    tone(1047,0.06,'square',0.055);
            tone(1319,0.06,'square',0.05,0.05);
            tone(1568,0.10,'square',0.045,0.10); },       // かいもの
  // ---- せんとう ----
  encounter(){ tone(196,0.10,'square',0.07);
               tone(262,0.10,'square',0.07,0.09);
               tone(392,0.16,'square',0.07,0.18);
               noise(0.20,0.05,0.18,600,4000); },         // まものが あらわれた
  hit(){    noise(0.10,0.10,0,300,2600);
            tone(160,0.13,'square',0.08,0,60); },         // こちらの こうげきが あたる
  crit(){   noise(0.14,0.13,0,500,5200);
            tone(320,0.10,'square',0.09,0,80);
            tone(1200,0.10,'square',0.06,0.02,300); },    // かいしんの いちげき
  miss(){   noise(0.09,0.05,0,1800,6000); },              // はずれ

  bgm(mapId){                      // ★ばしょの しゅべつで きょくを えらぶ

  bgmStop(){ if(typeof BGM!=='undefined'){ BGM.stopBattleAll ? BGM.stopBattleAll() : BGM.stop(); } },
