*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0a16;color:#f0eee6;

#stage{position:relative;width:100%;height:60%;background:#000;overflow:hidden}
#gl{width:100%;height:100%;display:block;image-rendering:pixelated}
#gl2d{position:absolute;inset:0;width:100%;height:100%;display:none;

#label{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;

  border:2px solid #fff;border-radius:0;letter-spacing:.05em;text-shadow:1px 1px 0 #000}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;

.hm{background:rgba(0,0,0,.68);border:2px solid #fff;border-radius:0;

.hm.dead{opacity:.45}
.hm.gold{border-color:#7a6a30}
.hn{color:#e8dcb0;font-size:10px}
.hv{color:#cfd6e8}
.bar{height:3px;background:#231d38;border-radius:2px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;background:#4fd07a}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

#chapter.show{opacity:1}

#chapter::before{margin-bottom:22px} #chapter::after{margin-top:22px}
#boot{position:fixed;inset:0;background:#0b0a16;display:flex;flex-direction:column;

#boot.hide{opacity:0;pointer-events:none}
#boot .t{font-size:19px;letter-spacing:.16em;color:#e8dcb0;margin-bottom:20px;
  text-shadow:0 0 12px rgba(200,170,90,.45)}
#boot .s{font-size:12px;color:#8f8aa8;margin-top:14px;letter-spacing:.08em}

#boot .bar i{display:block;height:100%;width:22%;background:linear-gradient(90deg,#4a6ad0,#9fd8f0);

@keyframes bootbar{0%{margin-left:-24%}100%{margin-left:100%}}
#boot .err{color:#e08080;font-size:12px;margin-top:16px;text-align:center;line-height:1.7;display:none}

/* ★つよさ：がめん ぜんたいに おおきく だす */
#status{display:none;position:absolute;left:2%;right:2%;top:2%;bottom:2%;
  background:rgba(8,6,18,.94);border:2px solid #fff;
  box-shadow:inset 0 0 0 1px #000;

  padding:14px 16px;overflow:hidden;box-sizing:border-box;
  display:none;flex-direction:column}

#status .st-sub{font-size:12px;color:#cfc4a0;margin-bottom:10px}

#status .st-k{color:#b8b0d0}
#status .st-v{color:#fff}
#status .st-sec{margin-top:12px;font-size:12px;color:#cfc4a0;

#status .st-sp{font-size:13px;line-height:1.5;columns:2;column-gap:14px}

.cmd-item{white-space:normal;overflow-wrap:anywhere;padding:1px 0}
.cmd-item.sel{color:#ffe98a}
#pad{position:relative;height:40%;background:#12101f;border-top:1px solid #2a2540}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;

.btn:active{background:#3d3660}
#btnU{left:74px;top:14px;width:54px;height:54px}

function pickLines(entry, ctx){
  for(const l of entry.lines){
    const w = l.when;
    if(!w) return l.text;
    if(w.ch && ctx.chapter !== w.ch) continue;         // ★しょうごとの せりふ
    if(w.state && ctx.townState !== w.state) continue;
    if(w.flag && !ctx.flags[w.flag]) continue;
    if(w.notFlag && ctx.flags[w.notFlag]) continue;
    return l.text;
  }
  return ['「……」'];
}
function npcAt(mapId, x, y){
  const list = NPCS[mapId];
  if(!list) return null;
  return list.find(n=>n.at === (x+','+y)) || null;
}
return {NPCS, QUESTS, pickLines, npcAt};

function get(no){ return CH[no] || CH[1]; }
function has(no){ return !!CH[no]; }
function list(){ return Object.keys(CH).map(Number).sort((a,b)=>a-b); }
// ボスが いる マップ → ボスの じょうほう（ぜんしょう ぶんを まとめて さがす）
function bossAt(chapter, map){
  const c = CH[chapter];
  return (c && c.bosses && c.bosses[map]) || null;
}
// とくべつな ますの あつかいを ひく
function specialTile(chapter, map, tile){
  const c = CH[chapter];
  if(!c || !c.specialTiles) return null;
  const hit = c.specialTiles.find(s=>s.map===map && s.tile===tile);
  return hit ? hit.handler : null;
}

return {CH, get, has, list, bossAt, specialTile};
})();

/* ══════════════════════════════════════════════
   3. オーディオグラフ
   ══════════════════════════════════════════════ */

/* ══ おとの グラフと がっき ══ */
function makeIR(ctx,sec,decay){
  const sr=ctx.sampleRate, len=Math.floor(sr*sec);
  const b=ctx.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c);
    for(let i=0;i<len;i++){
      const t=i/len;
      const early=(i>sr*0.012&&i<sr*0.045)?1.6:1;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*early;
    }
  }
  return b;
}
function makeNoise(ctx){
  const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function makeCurve(k){
  const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}
  return c;
}

function buildGraph(ctx){
  const out=ctx.createGain(); out.gain.value=0.82;
  const lim=ctx.createDynamicsCompressor();
  lim.threshold.value=-8; lim.knee.value=4; lim.ratio.value=8;
  lim.attack.value=0.004; lim.release.value=0.18;
  lim.connect(out); out.connect(ctx.destination);

  const glue=ctx.createDynamicsCompressor();
  glue.threshold.value=-20; glue.knee.value=12; glue.ratio.value=2.4;
  glue.attack.value=0.012; glue.release.value=0.24;
  glue.connect(lim);

  const dry=ctx.createGain(); dry.gain.value=1; dry.connect(glue);

  const conv=ctx.createConvolver(); conv.buffer=makeIR(ctx,2.9,2.3);
  const verbIn=ctx.createGain(); verbIn.gain.value=1;
  const verbOut=ctx.createGain(); verbOut.gain.value=0.75;
  const damp=ctx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=5200;
  const pre=ctx.createDelay(0.1); pre.delayTime.value=0.026;
  verbIn.connect(pre); pre.connect(damp); damp.connect(conv); conv.connect(verbOut); verbOut.connect(glue);

  return {ctx,out,dry,verb:verbIn,noise:makeNoise(ctx),shape:makeCurve(2.6)};
}

/* ══ 楽器 ══ */
function chain(G,t,pan,send){
  const g=G.ctx.createGain(); g.gain.value=0;
  const p=G.ctx.createStereoPanner?G.ctx.createStereoPanner():null;
  if(p){p.pan.value=pan||0; g.connect(p); p.connect(G.dry);}
  else g.connect(G.dry);
  const s=G.ctx.createGain(); s.gain.value=send;
  g.connect(s); s.connect(G.verb);
  return g;
}
function env(g,t,a,d,dur,v){
  const p=g.gain;
  p.setValueAtTime(0.0001,t);
  p.linearRampToValueAtTime(v,t+a);
  p.linearRampToValueAtTime(v*0.78,t+a+0.08);
  p.setValueAtTime(v*0.78,Math.max(t+a+0.08,t+dur-d));
  p.exponentialRampToValueAtTime(0.0001,t+dur+d);
}

const INST={
strings(G,t,p){
  const g=chain(G,t,p.p||0,0.42);
  const f=G.ctx.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(700,t); f.frequency.linearRampToValueAtTime(2600,t+0.35);
  f.Q.value=0.6; f.connect(g);
  [-7,0,7].forEach(dt=>{
    const o=G.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.value=p.f; o.detune.value=dt;
    o.connect(f); o.start(t); o.stop(t+p.d+0.6);

/* ══ さいせい（ライブ・さきよみスケジューリング）══ */
// セクションの かいし じこく（びょう）
const SECTION_AT = (()=>{
  const at={}; let bar=0;
  SECTIONS.forEach(s=>{ at[s.n]=bar*BAR; bar+=s.l; });
  return at;
})();
// ★せんとうは みじかい。13びょうの イントロを ながしていると
//   ほんぺんに はいる まえに たたかいが おわり、ほぼ むおんに きこえる。
//   そこで もりあがる ところから はじめ、そこへ ループさせる。
const START_AT = {
  battle: SECTION_AT.A      || 0,   // ふつうの せんとう ＝ Aメロから
  boss:   SECTION_AT.CHORUS || 0,   // ボス ＝ サビから
};
let AC=null, G=null, EVENTS=null, timer=null, playing=null;
let t0=0, idx=0, loopN=0, vol=0.42, lastNow=-1, stall=0, pending=null;
let songStart=0, loopSpan=1, idxStart=0;
const LOOKAHEAD=0.35, TICK=60;

// ★こうかおんと おなじ AudioContext を つかう。
//   べつべつに つくると、かたほうだけ「ていし」の ままに なり、
//   さいしょの すうびょうだけ なって とまる（じっさいに でた ふぐあい）。
let SHARED = null;
// ★こうかおんと べつの コンテキストに なると、こちらだけ「ていし」の まま に なり
//   おとが でない。わたされた ものを かならず つかう。
function attach(ac){
  if(!ac) return;
  SHARED = ac;
  if(AC !== ac){
    AC = ac;
    G = null;                    // ふるい コンテキストの グラフは すてて つくりなおす
  }
}
function ctx(){
  try{
    AC = AC || SHARED || new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){}
  return AC;
}
// おわった はっしんきを じどうで きりはなす。
// これを しないと たまりつづけ、iOSでは あたらしい おとが つくれなく なる。
let cleaned = null;
function autoClean(ac){
  if(!ac || cleaned===ac) return;
  cleaned = ac;
  ['createOscillator','createBufferSource'].forEach(m=>{
    if(typeof ac[m] !== 'function') return;
    const orig = ac[m].bind(ac);
    ac[m] = function(){
      const n = orig();
      try{
        n.addEventListener('ended', ()=>{ try{ n.disconnect(); }catch(e){} }, {once:true});
      }catch(e){
        try{ n.onended = ()=>{ try{ n.disconnect(); }catch(e2){} }; }catch(e3){}
      }
      return n;
    };
  });
}
function ensure(){
  if(!ctx()) return false;
  autoClean(AC);
  if(!G){
    try{ G = buildGraph(AC); }
    catch(e){ console.warn('[bgm] おとの グラフを つくれません', e); G = null; }
    if(G && G.out) G.out.gain.value = vol;
  }
  if(!EVENTS){
    EVENTS = buildEvents().slice().sort((a,b)=>a.t-b.t);
  }
  return !!G;
}
let fired = 0;
function fire(ev, when){ fired++;
  const f = INST[ev.i];
  if(f) try{ f(G, when, ev.p); }catch(e){}
}
function pump(){
  if(!playing || !G) return;
  // ★おとが まだ だせない あいだは よやくしない。まいかい さいかいを こころみ、
  //   きょくの あたまから はじめなおせるように しておく。
  if(AC.state !== 'running'){
    try{ AC.resume(); }catch(e){}
    t0 = AC.currentTime + 0.10 - songStart; idx = idxStart; loopN = 0; lastNow = -1;
    return;
  }
  const now = AC.currentTime;
  // ★みはり：とけいが すすんでいない（state は running でも とまることが ある）
  if(now <= lastNow){
    stall++;
    if(stall > 8){                       // やく0.5びょう すすまなければ たてなおす
      stall = 0;
      try{ AC.resume(); }catch(e){}
      t0 = now + 0.10 - songStart; idx = idxStart; loopN = 0;
    }
    return;
  }
  stall = 0; lastNow = now;
  // ★みはり②：じかんが おおきく とんだ（タブふっき など）→ いまの いちへ とばす
  const songPos = now - t0 - songStart;
  if(songPos > (loopN+1)*loopSpan + 1){
    loopN = Math.floor(songPos / loopSpan);
    idx = idxStart;
    while(idx < EVENTS.length && t0 + loopN*loopSpan + EVENTS[idx].t < now) idx++;
  }
  let guard = 0;
  while(idx < EVENTS.length){
    if(++guard > 4000) return;           // ばんいち むげんループを ふせぐ
    const ev = EVENTS[idx];
    const when = t0 + loopN*loopSpan + ev.t;
    if(when > now + LOOKAHEAD) return;
    if(when >= now - 0.05) fire(ev, when);
    idx++;
  }
  idx = idxStart; loopN++;        // イントロには もどらない
}
function begin(name){
  playing = name;
  songStart = START_AT[name] || 0;
  loopSpan = Math.max(1, LOOP - songStart);
  idxStart = 0;
  while(idxStart < EVENTS.length && EVENTS[idxStart].t < songStart) idxStart++;
  idx = idxStart; loopN = 0;
  t0 = AC.currentTime + 0.10 - songStart;   // ここから ならすと じこくを あわせる
  lastNow = -1;                  // さいしょの pump を みはりで はじかない
  gainNow(vol);                  // ★のこっている フェードを とりけして おんりょうを もどす
  pump();                        // だせない じょうたいなら pump が たてなおしを つづける
  if(timer) clearInterval(timer);
  timer = setInterval(pump, TICK);
}
function play(name){
  if(name !== 'battle' && name !== 'boss'){ stop(); return; }
  pauseField();                       // せんとうちゅうは いちじ ていし（いしは のこす）
  fieldUnlocked = true;               // せんとうちゅうに あけなおさない
  // ★おなじ きょくでも まいかい あたまから ならしなおす
  if(playing === name){ if(ensure()){ begin(name); } return; }
  if(!ensure()){ return; }
  stop();
  pending = null;
  // ★resume の やくそくは iOSでは かえってこない ことが ある。
  //   またずに はじめ、おとが だせるように なったら みはりが たてなおす。
  try{ AC.resume(); }catch(e){}
  begin(name);
}
// おんりょうの よやくを かならず とりけしてから きめる。
// ※ よやくを のこしたまま かけなおすと、はじめた とたんに 0へ さがって
//    「ぜんぜん きこえない」に なる（じっさいに でた ふぐあい）。
function gainNow(v){
  if(!G || !G.out || !AC) return;
  try{
    const g = G.out.gain, t = AC.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(v, t);
  }catch(e){ try{ G.out.gain.value = v; }catch(e2){} }
}
function fadeOut(){
  if(!G || !G.out || !AC) return;
  try{
    const g = G.out.gain, t = AC.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(0.0001, g.value), t);
    g.linearRampToValueAtTime(0.0001, t+0.18);
  }catch(e){}
}
function stopBattleAll(){        // ごうせい・ファイル どちらでも とめる
  stop();
  stopBattleFile();
}
function stop(){
  const wasPlaying = !!playing;
  if(wasPlaying) scheduleResume(220);
  if(timer){ clearInterval(timer); timer=null; }
  playing = null; pending = null; stall = 0; lastNow = -1;
  if(wasPlaying) fadeOut();      // ★なっていた ときだけ フェード。かけはじめでは さわらない
}
function setVolume(v){
  vol = Math.max(0, Math.min(1, v));
  gainNow(vol);
}
function resume(){ const a=ctx(); if(a && a.state==='suspended') a.resume(); }

/* ══ フィールドきょく（おんげんファイルを ながす）══ */
// せんとうきょくは はっしんきで つくるが、フィールドきょくは
// レンダリングずみの ファイルを ながす。<audio> なら メモリを くわない。
// ばしょごとの きょく。<audio> は 1つを つかいまわし、src を さしかえる。
const TRACKS = {field:'field.mp3', town:'town.mp3', castle:'castle.mp3', dungeon:'dungeon.mp3'};
let fieldEl = null, fieldWant = false, fieldVol = 0.55;
// ★きょくごとの おおきさ。どうくつは すこし しずかに する。
const TRACK_VOL = {field:1.00, town:1.00, castle:1.00, dungeon:0.62};
function volOf(track){ return fieldVol * (TRACK_VOL[track] || 1); }
// ★もどす しごとに ばんごうを つける。ふるい しごとは むこうに する。
//   （せんとうが つづくと、ふるい タイマーが きょくを かさねて ならして いた）
let resumeSeq = 0;
function scheduleResume(ms){
  const my = ++resumeSeq;
  setTimeout(()=>{
    if(my !== resumeSeq) return;              // あたらしい しごとが ある
    if(playing || batWant || !fieldWant) return;
    playField(fieldTrack);
  }, ms);
}
function cancelResume(){ resumeSeq++; }
let fieldTrack = 'field';                        // いま かかっている きょく
let fieldSrc = null, fieldGain = null, fieldErr = '';
function fieldAudio(){
  if(fieldEl) return fieldEl;
  try{
    fieldEl = new Audio(TRACKS[fieldTrack] || TRACKS.field);
    fieldEl.loop = true;
    fieldEl.preload = 'auto';          // さきに よみこんでおく
    fieldEl.crossOrigin = 'anonymous';
    fieldEl.volume = 1;                // おんりょうは グラフがわで きめる
    fieldEl.addEventListener('error', ()=>{
      const e = fieldEl.error;
      fieldErr = 'よみこみ しっぱい' + (e ? '(code '+e.code+')' : '');
    });

let batWant = false, batVol = 0.55, batErr = '', batTrack = null;

// ★ほかの せんとうきょくは かならず とめる
function silenceOtherBattle(keep){

    if(k === keep) return;

}
function playBattleFile(track){
  if(!BATTLE_TRACKS[track]) track = 'battle3';

  pauseField();                        // フィールドきょくも とめる
  batWant = true;

function setBattleVolume(v){
  batVol = Math.max(0, Math.min(1, v));

    if(batEls[k].gain){ try{ batEls[k].gain.gain.value = batVol; }catch(e){} }

function status(){
  const a = AC;
  return {
    ctx: a ? 'あり' : 'なし',
    state: a ? a.state : '-',
    time: a ? Math.round(a.currentTime*10)/10 : -1,

    track: fieldTrack,
    battleFile: batTrack ? (batEls[batTrack] && !batEls[batTrack].el.paused ? 'ながれている' : 'とまっている') : 'みよみこみ',
    battleErr: batErr || 'なし',
    fieldVol: fieldVol,
    fieldReady: fieldEl ? fieldEl.readyState : -1,
    fieldNet: fieldEl ? fieldEl.networkState : -1,

return {play, stop, setVolume, resume, attach, status,
        playBattleFile, stopBattleFile, setBattleVolume, stopBattleAll,

        playField, stopField, pauseField, unlockField, setFieldVolume,
        get fieldOn(){return fieldWant;}, get track(){return fieldTrack;}, TRACKS,
        get current(){return playing;},
        get bars(){return BARS;}, get bpm(){return BPM;},
        get startAt(){return START_AT;}, get sectionAt(){return SECTION_AT;},
        get sections(){return SECTIONS;},
        get eventCount(){ ensure(); return EVENTS?EVENTS.length:0; },
        debugEvents(){ return buildEvents(); }};
})();

const View2D = (function(){

  // やま（ちゃ）
  mt0:'#4c3826', mt1:'#6a4f36', mt2:'#8a6a48', mt3:'#a88860', mtS:'#382818',
  // もり（4しょく）
  fo0:'#16290f', fo1:'#22401a', fo2:'#325a26', fo3:'#477a34',
  // ゆき
  sn0:'#9fb0c4', sn1:'#c2d0de', sn2:'#dbe5ef', sn3:'#eef4fa',
  // こおり
  ic0:'#5f86a6', ic1:'#84a8c4', ic2:'#a8c6dc', ic3:'#cfe2ee',
  // いし（しろい かべ）
  st0:'#6a7182', st1:'#8f97a8', st2:'#b4bcc9', st3:'#d6dce5',
  // たてもの
  roof0:'#7a2820', roof1:'#a63c2c', roof2:'#c85a3c', wall0:'#8e8272',
  wall1:'#c8bfa8', wall2:'#e2dcc6', wood0:'#5a3f26', wood1:'#7d5a36',

function R(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x,y,w,h); }

      P(g,x,y,P16.mt0); P(g,x+1,y,P16.mt2);
    });
    // ★くろい アーチの いりぐち（うえが まるい）
    R(g,7,9,2,1,P16.blk);
    R(g,6,10,4,6,P16.blk);
    P(g,6,9,'#2a2028'); P(g,9,9,'#2a2028');
    R(g,6,10,4,1,'#241c26');                        // おくの かげ
    P(g,5,10,P16.mt3); P(g,10,10,P16.mt0);          // いりぐちの ふち
    // したの かげ
    R(g,1,15,14,1,P16.mtS);
  });
  atlas.mFuture = marker((g,s)=>{
    R(g,4,10,8,5,'#8a8f9a'); R(g,4,10,8,1,'#a8adb8');
    for(let y=1;y<=4;y++){ const half=Math.min(5,y+1); R(g,8-half,9-y,half*2,1,'#6a6f7a'); }
    R(g,6,12,2,2,'#4a4f5a');
  });
}

const BUILD_CHARS = 'HIPWMS';        // H＝かべ／ I P W M S ＝ とびら
function isBuild(rows,x,y){
  if(y<0||y>=rows.length||x<0||x>=rows[0].length) return false;
  return BUILD_CHARS.includes(rows[y][x]);
}
const DOOR_ART = {I:'bdDoorInn', P:'bdDoorChurch', W:'bdDoorWeapon',
                  M:'bdDoorMagic', S:'bdDoorShop'};
function drawBuilding(rows,x,y,dx,dy,ts){
  const ch = rows[y][x];
  const up = isBuild(rows,x,y-1), dn = isBuild(rows,x,y+1);
  const lf = isBuild(rows,x-1,y), rt = isBuild(rows,x+1,y);
  const side = !lf ? 'L' : (!rt ? 'R' : 'M');
  if(ch!=='H'){                                  // とびら
    cx.drawImage(atlas[DOOR_ART[ch]] || atlas.bdDoor, dx, dy, ts, ts);
    return;
  }
  const kind = !up ? 'peak' : (dn ? 'mid' : 'wall');
  cx.drawImage(atlas['bd_'+kind+'_'+side], dx, dy, ts, ts);
  // かべの れつには まどを つける（とびらの まうえは のぞく）
  if(kind==='wall' && side==='M' && ((x+y)%2===0) && !isBuild(rows,x,y+1)){
    cx.drawImage(atlas.bdWindow, dx, dy, ts, ts);
  }
}
// ---------------- タイル → え の わりあて ----------------
function tileArt(ch, theme){
  const ice = theme==='ice', snowT = theme==='snow', cave = theme==='cave';
  switch(ch){
    // ---- ワールドマップ ----
    case '~': return atlas.sea;
    case '_': return atlas.beach;
    case ',': return atlas.woods;
    case '^': return atlas.mount;
    case 'A': return atlas.mCastle;
    case 'V': return atlas.mVillage;
    case 'X': return atlas.mCave;
    case 'Q': return atlas.mFuture;
    case '#': return ice?atlas.icewall : (cave?atlas.rockwall : atlas.wall);
    case 'w': return atlas.water;
    case 'f': return snowT?atlas.tree : atlas.tree_g;
    case 'o': return ice?atlas.icicle : atlas.rock;
    case 't': return atlas.torch;
    case 'C': return atlas.chest;
    case 'I': return atlas.inn;
    case 'P': return atlas.church;
    case 'w': return atlas.well;      // ※ ワールドの みずうみは floorで しょり
    case 'e': return atlas.fence;
    case '*': return atlas.flower;

    case 'K': return atlas.castgate;
    case 'F': return atlas.fountain;
    case 'G': return atlas.gate;
    case 'T': return atlas.tower;
    case 'D': return atlas.door;

}

// ---- ゆか＋ふち を 1まいに やきこんで ためる ----
// まいフレーム 9かい かさねると おもいので、はじめて みた ときだけ つくる
const DIRS8=[['N',0,-1],['S',0,1],['W',-1,0],['E',1,0],
             ['NW',-1,-1],['NE',1,-1],['SW',-1,1],['SE',1,1]];
let groundCache = {};
function groundTile(x,y,terrainOf){
  const k = curMap+':'+x+','+y;
  const hit = groundCache[k];
  if(hit) return hit;
  const t = terrainOf(x,y);
  const c = mk(TS,TS), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(hashPick(x,y,atlas[t]),0,0);
  const rank = TERRAIN_RANK[t]||0;
  DIRS8.forEach(([dir,dx,dy])=>{
    const nt = terrainOf(x+dx,y+dy);
    if(!nt || nt===t) return;
    if((TERRAIN_RANK[nt]||0) <= rank) return;
    const src = hashPick(x+dx,y+dy,atlas[nt]);
    g.drawImage(edgeTile(src, nt+':'+atlas[nt].indexOf(src), dir),0,0);
  });
  groundCache[k] = c;
  return c;
}

function resize(){

  cv.width  = Math.max(1, Math.round(r.width*dpr));

// ============================================================
// せんとう（2Dドットえ）
// SFCの ように、はいけいは よこいちれつの じめん＋とおくの シルエット。
// ============================================================
let bFoes = [], bFx = null, bShake = 0, bFlash = 0, bParts = [], bTheme = 'plain';
let bBack = null, bEnter = 0;

function battleBackdrop(theme){
  const key = theme;
  if(bBack && bBack.key===key) return bBack;
  const BW = 256, BH = 176;                       // たてを ふやして がめんを うめる
  const c = mk(BW,BH), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const set = {
    snow:  {sky:'#161f36', sky2:'#1e2a45', far:'#2a3f5c', mid:'#44567a',
            gnd:atlas.snowfield, haze:'#39496b'},
    ice:   {sky:'#0d1728', sky2:'#152438', far:'#20344a', mid:'#2e4f6a',
            gnd:atlas.ice,       haze:'#2a4560'},
    cave:  {sky:'#090c14', sky2:'#101520', far:'#181d2a', mid:'#262c3c',
            gnd:atlas.rockwall,  haze:'#202634'},
    world: {sky:'#111a2e', sky2:'#1a2540', far:'#20304a', mid:'#2c4438',
            gnd:atlas.plain,     haze:'#26374e'},
    indoor:{sky:'#100e18', sky2:'#191527', far:'#221d2c', mid:'#332b40',
            gnd:atlas.pave,      haze:'#2a2438'},
  };
  const S = set[theme] || (theme==='village'||theme==='field'||theme==='plain' ? set.world
          : theme==='castle' ? set.indoor : set.world);
  const horizon = 106;

  // ---- そら：2だんの ベタ ＋ ディザで つなぐ（グラデーションは つかわない）----
  R(g,0,0,BW,horizon*0.55,S.sky);
  R(g,0,horizon*0.55,BW,horizon-horizon*0.55,S.sky2);
  for(let y=Math.floor(horizon*0.42);y<Math.floor(horizon*0.62);y++){
    const d = (y-horizon*0.42)/(horizon*0.20);
    for(let x=0;x<BW;x++){
      if(((x+y)%2===0) && nz(x,y,2)<d) P(g,x,y,S.sky2);
      if(((x+y)%2===1) && nz(x,y,3)>d) P(g,x,y,S.sky);
    }
  }
  // ほし
  if(theme!=='cave' && theme!=='indoor' && theme!=='castle'){
    for(let i=0;i<40;i++){
      const x=Math.floor(nz(i,1,3)*BW), y=Math.floor(nz(i,2,5)*(horizon-40));
      P(g,x,y, i%5? '#39496b' : '#8ea2c8');
    }
  }
  // ---- とおくの やまなみ：なめらかな りょうせん（サインの かさねあわせ）----
  function ridge(baseY, amp, freq, phase, col, colLit){
    const h=[];
    for(let x=0;x<BW;x++){
      const t=x/BW*Math.PI*2;
      const v = Math.sin(t*freq+phase)*0.55
              + Math.sin(t*freq*2.3+phase*1.7)*0.28
              + Math.sin(t*freq*4.1+phase*2.9)*0.17;
      h.push(Math.round(baseY - (v*0.5+0.5)*amp));
    }
    for(let x=0;x<BW;x++){
      const y0=h[x];
      R(g,x,y0,1,horizon-y0+2,col);
      // みぎうえの ひかり：りょうせんが みぎさがりの ところを あかるく
      if(x>0 && h[x] >= h[x-1]) P(g,x,y0,colLit);
      // りんかくの ディザ（1ドットの ぎざつきで なじませる）
      if((x%2===0) && x>0 && h[x]!==h[x-1]) P(g,x,y0-1,col);
    }
  }
  ridge(horizon-8, 30, 1.6, 0.7, S.far, S.haze);
  ridge(horizon-1, 18, 2.4, 2.1, S.mid, S.haze);
  // ちへいせんの もや（ディザ2れつ）
  for(let x=0;x<BW;x++){
    if((x+0)%2===0) P(g,x,horizon-1,S.haze);
    if((x+1)%3===0) P(g,x,horizon-2,S.haze);
  }

  // ---- じめん：ちけいの タイルを しきつめる ----
  const gnd = Array.isArray(S.gnd) ? S.gnd[0] : S.gnd;
  const gnd2 = Array.isArray(S.gnd) ? (S.gnd[1]||S.gnd[0]) : S.gnd;
  for(let y=horizon;y<BH;y+=TS)for(let x=0;x<BW;x+=TS){
    g.drawImage(((x/TS + y/TS)%2) ? gnd2 : gnd, x, y);
  }
  // ちへいせん ちかくを ディザで くらくして おくゆきを だす
  for(let y=horizon;y<horizon+10;y++){
    const d=1-(y-horizon)/10;
    for(let x=0;x<BW;x++){
      if(((x+y)%2===0) && nz(x,y,9)<d*0.85) P(g,x,y,S.mid);
    }
  }
  // てまえを だんかいてきに くらく（4だん・ベタ）
  for(let i=0;i<4;i++){
    const y = horizon + Math.floor((BH-horizon)*(i+1)/5);
    g.fillStyle = 'rgba(0,0,0,'+(0.05+i*0.045)+')';
    g.fillRect(0,y,BW,BH-y);
  }
  bBack = {key, canvas:c, w:BW, h:BH, horizon};
  return bBack;
}

function battleEnter2D(enemies, mon, done){
  const m = C.MAPS[C.P.map];
  bTheme = (m && m.theme) || 'plain';
  battleBackdrop(bTheme);
  bFoes = enemies.map((e,i)=>{
    // art が あれば その えを つかう（あたらしい ボスに きそんの えを あてる）。
    // まものの えに なければ キャラの えも さがす（しまいの かげ など）。
    const d = (mon && (mon[e.art] || mon[e.key]))
           || (CHRREF && (CHRREF[e.art] || CHRREF[e.key]))
           || null;
    return {enemy:e, art:d, idx:i, n:enemies.length, ph:nz(i,3,9)*6, fade:1, z:0};
  });
  bParts = []; bShake = 0; bFlash = 0; bEnter = 0;
  bFx = {kind:'enter', t:0, done};
}
function battleFx2D(kind, data, done){
  if(kind==='attack'||kind==='spell'||kind==='spellall'){
    bFx = {kind:'pattack', t:0, done, target:data && data.target};
  }else if(kind==='enemyattack'||kind==='enemyaoe'){
    const actor = data && data.from ? bFoes.find(f=>f.enemy===data.from) : null;
    bFx = {kind:'eattack', t:0, done, actor, wide:(kind==='enemyaoe')};
  }else if(kind==='heal'){
    bFx = {kind:'heal', t:0, done};
  }else if(done) done();
}
function battleLeave2D(done){ bFx = {kind:'leave', t:0, done}; }

function burst2D(target){
  const f = target ? bFoes.find(x=>x.enemy===target) : bFoes[0];
  const cx0 = f ? f._cx : W/2, cy0 = f ? f._cy : H/2;
  for(let i=0;i<12;i++){
    bParts.push({x:cx0, y:cy0,
      vx:(nz(i,1,11)-0.5)*260, vy:-(60+nz(i,2,12)*220),
      life:0.5, col: i%2 ? '#f0c058' : '#e06038'});
  }
}

function drawBattle(dt, time){
  if(!cv) return;
  const back = battleBackdrop(bTheme);
  // ---- えんしゅつの しんこう ----
  let zoom = 1, ox2 = 0;
  if(bFx){
    bFx.t += dt;
    const s = bFx;
    if(s.kind==='enter'){
      bEnter = Math.min(1, s.t/0.5);
      if(s.t>0.55){ const d=s.done; bFx=null; d&&d(); }
    }else if(s.kind==='pattack'){
      if(s.t<0.16) zoom = 1 + s.t*0.5;
      else if(s.t<0.24){ if(!s.hit){ s.hit=true; bShake=0.26; bFlash=0.5; burst2D(s.target); } zoom=1.08; }
      else if(s.t<0.5) zoom = 1.08 - (s.t-0.24)*0.32;
      else { const d=s.done; bFx=null; d&&d(); }
    }else if(s.kind==='eattack'){
      const reach = s.wide ? 8 : 14;
      if(s.actor){
        if(s.t<0.2) s.actor.z = s.t*(reach/0.2);
        else if(s.t<0.5) s.actor.z = reach-(s.t-0.28)*(reach/0.3);
        else s.actor.z = 0;
      }
      if(s.t>=0.2 && s.t<0.28 && !s.hit){ s.hit=true; bShake=s.wide?0.34:0.26; bFlash=s.wide?0.45:0.3; }
      if(s.t>0.55){ if(s.actor) s.actor.z=0; const d=s.done; bFx=null; d&&d(); }
    }else if(s.kind==='heal'){
      if(s.t>0.3){ const d=s.done; bFx=null; d&&d(); }
    }else if(s.kind==='leave'){
      if(s.t>0.2){ const d=s.done; bFx=null; d&&d(); return; }
    }
  }
  if(bShake>0){ bShake-=dt; ox2 = (nz(time*60|0,1,13)-0.5)*bShake*26; }

  // ---- はいけい：たてを うめる せいすうばい。よこは あふれても よい（ちゅうおうよせ）----
  const sc = Math.max(1, Math.ceil(H/back.h));
  const bw = back.w*sc, bh = back.h*sc;
  cx.fillStyle = '#0a0c14'; cx.fillRect(0,0,W,H);
  const bx = Math.round((W-bw)/2 + ox2), by = Math.round(H-bh);
  cx.drawImage(back.canvas, bx, by, bw, bh);

  // ---- てき ----
  const groundY = by + back.horizon*sc + Math.round((bh-back.horizon*sc)*0.46);
  bFoes.forEach((f,i)=>{
    if(f.enemy.hp<=0){ f.fade = Math.max(0, f.fade - dt*2.2); }
    if(f.fade<=0) return;
    const n = f.n;
    const spread = (n===1) ? 0 : (i-(n-1)/2) * (Math.min(bw,W)*0.28);
    const breathe = 1 + Math.sin(time*2.1+f.ph)*0.03;
    const sway = Math.sin(time*0.85+f.ph)*(sc*1.5);
    // はいけいと おなじ せいすうばい ＝ ドットの あらさが そろう
    const esc = Math.max(1, Math.round(sc*0.62*zoom));
    let hh, ww;
    if(f.art){ hh = f.art.h*esc; ww = f.art.w*esc; }
    else { hh = 48*esc; ww = 48*esc; }
    const cx0 = bx+bw/2 + spread + sway + ox2;
    const cy0 = groundY - f.z*sc - Math.sin(time*1.7+f.ph)*sc;
    f._cx = cx0; f._cy = cy0 - hh*0.5;
    cx.globalAlpha = f.fade;
    // かげ
    cx.fillStyle='rgba(0,0,0,0.35)';
    cx.beginPath(); cx.ellipse(cx0, cy0, ww*0.30, sc*3, 0, 0, Math.PI*2); cx.fill();
    if(f.art){
      const img = getImg(f.art.src || f.art.front);
      if(img.complete && img.naturalWidth){
        const dh = Math.round(hh*breathe), dw = Math.round(ww/breathe);
        cx.drawImage(img, Math.round(cx0-dw/2), Math.round(cy0-dh), dw, dh);
      }
    }else{
      cx.fillStyle='#8f4fa0';
      cx.fillRect(Math.round(cx0-ww/2), Math.round(cy0-hh), ww, hh);
    }
    cx.globalAlpha = 1;
  });

  // ---- つぶ ----
  bParts = bParts.filter(p=>{
    p.life -= dt;
    if(p.life<=0) return false;
    p.vy += dt*900; p.x += p.vx*dt; p.y += p.vy*dt;
    cx.fillStyle = p.col;
    cx.fillRect(Math.round(p.x), Math.round(p.y), sc*2, sc*2);
    return true;
  });

  // ---- とうじょうの スライドイン ----
  if(bEnter<1){
    cx.fillStyle='rgba(0,0,0,'+(1-bEnter)+')';
    cx.fillRect(0,0,W,H);
  }
  if(bFlash>0){
    cx.fillStyle='rgba(255,255,255,'+bFlash+')';
    cx.fillRect(0,0,W,H);
    bFlash = Math.max(0, bFlash - dt*2.6);
  }
  if(fadeV>0){ cx.fillStyle='rgba(0,0,0,'+fadeV+')'; cx.fillRect(0,0,W,H); }
}

// ============================================================

let mapOn = false, mapId = null, mapBlink = 0;
const MAPCOL = {
  '~':'#20386e','w':'#3c48a0','_':'#c8a86c','.':'#48a854',',':'#22401a',
  '=':'#c2d0de',':':'#dfc47f','^':'#6a4f36','r':'#a88a52',
  '#':'#6a7182','f':'#22401a','o':'#8a6a48','t':'#c85a20',
  'I':'#d8b040','P':'#dcdce8','S':'#c87830','W':'#b04038','M':'#7048a8',
  'K':'#b4bcc9','F':'#3d68ac','G':'#c8a86c','D':'#7d5a36','Z':'#dcd0f0',
  'C':'#d9a832','n':'#e8e8f0','B':'#8a2a3a','<':'#b4bcc9','>':'#b4bcc9',
  'A':'#e8e0d0','V':'#e0a040','X':'#3a3a44','Q':'#8a8f9a',
};
function showMap(id){ mapOn = true; mapId = id; }
function hideMap(){ mapOn = false; }
function drawMapOverlay(time){
  const m = C.MAPS[mapId]; if(!m) return;
  const rows = m.tiles, MW = rows[0].length, MH = rows.length;
  // がめんに おさまる せいすうばい
  const pad = Math.round(Math.min(W,H)*0.06);
  const sc = Math.max(1, Math.min(Math.floor((W-pad*2)/MW), Math.floor((H-pad*2.6)/MH)));
  const mw = MW*sc, mh = MH*sc;
  const ox = Math.round((W-mw)/2), oy = Math.round((H-mh)/2 + pad*0.2);

  cx.fillStyle='rgba(0,0,0,0.82)'; cx.fillRect(0,0,W,H);
  // わく
  cx.fillStyle='#fff'; cx.fillRect(ox-sc*2, oy-sc*2, mw+sc*4, mh+sc*4);
  cx.fillStyle='#000'; cx.fillRect(ox-sc,   oy-sc,   mw+sc*2, mh+sc*2);
  // ちけい
  for(let y=0;y<MH;y++){
    const r = rows[y];
    for(let x=0;x<MW;x++){
      const col = MAPCOL[r[x]];
      if(!col) continue;
      cx.fillStyle = col;
      cx.fillRect(ox+x*sc, oy+y*sc, sc, sc);
    }
  }
  // いった ことの ある ちてんだけ しるし（しろい わく）
  const known = C.G.visited || {};
  Object.keys(m.warpsXY||{}).forEach(pos=>{
    const [x,y] = pos.split(',').map(Number);
    const to = m.warpsXY[pos].to;
    if(!known[to]) return;
    cx.fillStyle='#fff';
    cx.fillRect(ox+x*sc-sc, oy+y*sc-sc, sc*3, 1);
    cx.fillRect(ox+x*sc-sc, oy+y*sc+sc*2, sc*3, 1);
    cx.fillRect(ox+x*sc-sc, oy+y*sc-sc, 1, sc*3);
    cx.fillRect(ox+x*sc+sc*2, oy+y*sc-sc, 1, sc*3);
  });
  // じぶんの いち（てんめつ）
  mapBlink = (mapBlink + 1) % 60;
  if(mapBlink < 38){
    const s2 = Math.max(2, sc+1);
    cx.fillStyle='#ff4a4a';
    cx.fillRect(ox+C.P.x*sc - (s2-sc)/2, oy+C.P.y*sc - (s2-sc)/2, s2, s2);
    cx.fillStyle='#fff';
    cx.fillRect(ox+C.P.x*sc, oy+C.P.y*sc, Math.max(1,sc-1), Math.max(1,sc-1));
  }
  // みだし
  const label = (C.areaName ? C.areaName(mapId, C.P.x, C.P.y) : C.WORLD.mapName(mapId));
  cx.fillStyle='#fff';
  cx.font = Math.round(H*0.030)+'px sans-serif';
  cx.textAlign='center';
  cx.fillText(label, W/2, oy-sc*4);
  cx.font = Math.round(H*0.022)+'px sans-serif';
  cx.fillStyle='#bfc6d8';
  cx.fillText('ボタンを おすと とじます', W/2, oy+mh+sc*5);
  cx.textAlign='left';
}

// ---------------- びょうが ----------------
function draw(dt, time, actors){
  if(!cv || !curMap) return;
  const m = C.MAPS[curMap];
  if(!m) return;
  const rows = m.tiles, MW = rows[0].length, MH = rows.length;
  const theme = m.theme;
  const dpr = Math.min(devicePixelRatio||1, 2);
  // みおろす ひろさ：せかいちずは ひろく、まちの なかは すこし よせる
  // ※ タイルの おおきさは かならず せいすう。はんぱが あると すきまが できて
  //    くろい せんに なる（じっさいに でた ふぐあい）
  // ズームは せいすうばい のみ。はんぱな ばいりつだと ドットの おおきさが
  // ばらついて「てうちドット」に みえなくなる。
  // tilesTall は「すくなくとも これだけは うつす」という かずなので、
  // まるめは きりすて（round だと たてが たりなく なることが ある）。
  const tilesTall = (theme==='world') ? 18 : 15;
  const scale = Math.max(2, Math.floor(H / (tilesTall*TS)));
  const ts = TS*scale;   // かならず せいすうばい

  // カメラ（プレイヤーちゅうしん・はしで とめる）
  const p = actors && actors[0] ? actors[0] : {x:C.P.x, y:C.P.y};
  const viewW = W/ts, viewH = H/ts;
  camX = Math.min(Math.max(p.x+0.5, viewW/2), Math.max(viewW/2, MW-viewW/2));
  camY = Math.min(Math.max(p.y+0.5, viewH/2), Math.max(viewH/2, MH-viewH/2));
  // カメラの ずれも せいすうに して、すべての タイルが ぴったり ならぶように する
  const ox = Math.round(W/2 - camX*ts), oy = Math.round(H/2 - camY*ts);

  // はいけい
  cx.fillStyle = theme==='ice' ? '#0d2036' : theme==='cave' ? '#0a1020'
               : curNight ? '#141a30' : '#1a2436';
  cx.fillRect(0,0,W,H);

  const x0 = Math.max(0, Math.floor(-ox/ts)-1), x1 = Math.min(MW-1, Math.ceil((W-ox)/ts)+1);
  const y0 = Math.max(0, Math.floor(-oy/ts)-1), y1 = Math.min(MH-1, Math.ceil((H-oy)/ts)+1);
  const floor = floorArt(theme), road = roadArt(theme);

  // ① ゆか
  // タイルもじ → ちけいめい（ワールド）
  // ★やま（^）と しげみ（,）は 「その うえに たつ もの」なので、
  //   あしもとの ちけいは まわりから ひきつぐ（ゆきの やまは ゆきの うえに）。
  const W2T = {'.':'plain','=':'snowfield',':':'desert','_':'beach','~':'sea','w':'lake',
               'r':'highway'};
  const terrainOf = (tx,ty)=>{
    if(tx<0||ty<0||ty>=MH||tx>=MW) return null;
    const c = rows[ty][tx];
    if(W2T[c]) return W2T[c];
    // ちてん・やま・しげみ などは まわりの ちけいを ひきつぐ。
    // ★となりが ぜんぶ やまだと ひろえないので、だんだん とおくまで さがす。
    for(let r=1; r<=6; r++){
      const votes={};
      for(let dy=-r; dy<=r; dy++) for(let dx=-r; dx<=r; dx++){
        if(Math.abs(dx)!==r && Math.abs(dy)!==r) continue;   // わくの ぶんだけ
        const n=rows[ty+dy] && rows[ty+dy][tx+dx];
        if(n && W2T[n]) votes[W2T[n]]=(votes[W2T[n]]||0)+1;
      }
      const keys=Object.keys(votes);
      if(keys.length) return keys.reduce((a,b)=>votes[a]>=votes[b]?a:b);
    }
    return 'plain';
  };
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const ch = rows[y][x];
    const dx0 = ox+x*ts, dy0 = oy+y*ts;
    if(theme==='world'){
      cx.drawImage(groundTile(x,y,terrainOf), dx0, dy0, ts, ts);   // やきこみずみ 1まい
    }else{
      let base = (ch==='r') ? road : floor;
      // ★NPC・たからばこ など「うえに のる」ものの あしもとは、
      //   まわりの じめん（みち r／すな _）を ひきつぐ。
      //   トロスは すな(_)の うえに NPCが いて、したの くさが みえていた。
      if('nCB<>SWMIPFt*e'.includes(ch)){
        let rn=0, sn=0;
        for(const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const c2 = rows[y+ddy] && rows[y+ddy][x+ddx];
          if(c2==='r') rn++; else if(c2==='_') sn++;
        }
        if(sn>=2 && sn>=rn) base = atlas.beach;
        else if(rn>=2) base = road;
      }
      cx.drawImage(Array.isArray(base)?hashPick(x,y,base):base, dx0, dy0, ts, ts);
    }
  }
  // ② あしあと（ゆきの うえ）
  if(curScene.footprints){
    foot.forEach(f=>{
      cx.globalAlpha = Math.max(0, f.life)*0.45;
      cx.fillStyle = '#8fa2bd';
      const fx = ox+f.x*ts + ts*(f.side?0.58:0.30), fy = oy+f.y*ts + ts*0.55;
      cx.fillRect(px(fx), px(fy), Math.max(2,scale*3), Math.max(3,scale*4));
      cx.globalAlpha = 1;
    });
  }
  // ③ ちけい・たてもの（うしろから じゅんに）
  const _bossQ = [];
  const _mkQ = [];   // ★まちの アイコン（おおきく めだたせる）
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const ch = rows[y][x];
    if(ch==='C' && C.G.gotTreasure[curMap+':'+x+','+y]){
      cx.drawImage(atlas.chest_open, ox+x*ts, oy+y*ts, ts, ts); continue;
    }
    // ★ふなつきば（まちの なか）：ゆかを えがいてから ふねを かさねる
    if(theme!=='world' && ch==='j'){
      const fa = floorArt(theme);
      cx.drawImage(Array.isArray(fa)?hashPick(x,y,fa):fa, ox+x*ts, oy+y*ts, ts, ts);
      cx.drawImage(atlas.boat, ox+x*ts, oy+y*ts, ts, ts);
    }
    // ★たてものは まわりを みて やねを くみたてる
    else if(theme!=='world' && BUILD_CHARS.includes(ch)){
      drawBuilding(rows, x, y, ox+x*ts, oy+y*ts, ts);
    }
    // ワールドの きほん ちけいは ゆかの パスで えがきおえている（うわがきしない）
    else if(theme==='world' && ch==='j'){
      // ★まわりの ちけいを したじに してから ふねを かさねる
      cx.drawImage(groundTile(x,y,terrainOf), ox+x*ts, oy+y*ts, ts, ts);
      cx.drawImage(atlas.boat, ox+x*ts, oy+y*ts, ts, ts);
    }
    else if(theme==='world' && '.=:_~wr'.includes(ch)) { /* ゆかのみ */ }
    else if(theme==='world' && (ch==='A'||ch==='V')){
      _mkQ.push([ch, ox+x*ts, oy+y*ts]);
    }
    else {
      let art = tileArt(ch, theme);
      if(Array.isArray(art)) art = hashPick(x,y,art);
      if(art) cx.drawImage(art, ox+x*ts, oy+y*ts, ts, ts);
    }
    if(ch==='n') drawNPC(ox+x*ts, oy+y*ts, ts, x, y);
    // ★ボスは いったん ためて、ちけいを ぜんぶ かいたあとに えがく。
    //   さきに かくと、みぎ・したの ゆかタイルが ボスの はみだしを うわがきして
    //   「みぎうでが かける」げんしょうが おきていた。
    if(ch==='B'){
      const bi = C.bossInfoAt ? C.bossInfoAt(curMap) : null;
      const done = bi && bi.clearedFlag && C.G.flags[bi.clearedFlag];
      if(!done) _bossQ.push([ox+x*ts, oy+y*ts, ts]);
    }
  }
  // ★まち・むらは 1.45ばいで えがく（ちいさくて みつけにくかった）
  _mkQ.forEach(([ch,mx,my])=>{
    const art = ch==='A' ? atlas.mCastle : atlas.mVillage;
    const mw = ts*1.45, mh = ts*1.45;
    cx.drawImage(art, Math.round(mx + ts/2 - mw/2), Math.round(my + ts - mh), mw, mh);
  });
  _mkQ.length=0;
  _bossQ.forEach(([bx,by,bts])=>drawBoss(bx,by,bts));
  _bossQ.length=0;
  // ★もやって ある ふね（ワールドのみ）
  if(theme==='world' && C.G && C.G.ship && !C.G.aboard){
    const sx=C.G.ship.x, sy=C.G.ship.y;
    cx.drawImage(groundTile(sx,sy,terrainOf), ox+sx*ts, oy+sy*ts, ts, ts);
    cx.drawImage(atlas.boat, ox+sx*ts, oy+sy*ts, ts, ts);
  }
  // ④ キャラ（Yじゅんに かさねる）★ふねに のって いる あいだは ふねだけを えがく
  let list = (actors||[]).slice();
  if(C.G && C.G.aboard && theme==='world' && list.length){
    const lead=list[0];
    cx.drawImage(atlas.boat, ox+lead.x*ts, oy+lead.y*ts, ts, ts);
    list=[];
  }
  list = list.sort((a,b)=>a.y-b.y);
  list.forEach(a=>drawChar(a, ox, oy, ts, time));

  // ⑤ てんこう・じかん
  // ★ワールドは あるくと ちほうが かわる ので、えがく たびに たしかめる。
  //   まえは マップに はいった ときだけ きめて いた ため、
  //   ゆきの ちほうに はいっても ふらなかった。
  updateSnow();
  if(flakes) drawSnow(dt, ts);
  if(curNight && curScene.aurora) drawAurora(time);
  drawTint();
  if(fadeV>0){ cx.fillStyle='rgba(0,0,0,'+fadeV+')'; cx.fillRect(0,0,W,H); }
  drawDream();
  if(mapOn) drawMapOverlay(time);
}
let NPCREF = null;
function setNpcData(n){ NPCREF = n; }
function drawNPC(dx,dy,ts,x,y){
  const s=ts;
  cx.fillStyle='rgba(16,20,34,0.30)';
  cx.beginPath(); cx.ellipse(dx+s/2, dy+s*0.86, s*0.24, s*0.09, 0, 0, Math.PI*2); cx.fill();
  // NPCデータから みためを ひく（なければ むらびとb）
  let key='villagerB';
  if(NPCREF && NPCREF.npcAt){
    const e=NPCREF.npcAt(curMap, x, y);
    if(e && e.spr) key=e.spr;
  }
  const d = CHRREF && CHRREF[key];
  if(d){
    const img=getImg(d.front||d.src);
    if(img.complete && img.naturalWidth){
      const sc=ts/TS;
      const ww=Math.round(d.w*sc), hh=Math.round(d.h*sc);
      cx.drawImage(img, Math.round(dx+s/2-ww/2), Math.round(dy+s*0.95-hh), ww, hh);
      return;
    }
  }
  cx.fillStyle='#3f5a9e'; cx.fillRect(px(dx+s*0.30), px(dy+s*0.38), s*0.40, s*0.42);
  cx.fillStyle='#f2c79c'; cx.fillRect(px(dx+s*0.33), px(dy+s*0.18), s*0.34, s*0.24);
}
let MONREF = null;
function setMon(m){ MONREF = m; }
function drawBoss(dx,dy,ts){
  const s=ts;
  cx.fillStyle='rgba(40,10,60,0.35)';
  cx.beginPath(); cx.ellipse(dx+s/2, dy+s*0.86, s*0.36, s*0.12, 0, 0, Math.PI*2); cx.fill();
  // ★そのマップの ボスの えを つかう（せんとうちゅうと おなじ すがた）。
  //   マップめいを かためがきして いた ため、あたらしい ボスが かげのままだった。
  // ★そのマップの ボスの えを つかう（せんとうちゅうと おなじ すがた）。
  //   そうしボス（pair）は 2たいで 1くみ なので、ならべて えがく。
  const arts = [];
  const bi = C.bossInfoAt ? C.bossInfoAt(C.P.map) : null;
  if(bi){
    const pick = (key)=>{
      const b = C.MIDBOSS && C.MIDBOSS[key];
      const art = (b && b.art) || key;
      return (MONREF && (MONREF[art] || MONREF[key]))
          || (CHRREF && (CHRREF[art] || CHRREF[key])) || null;
    };
    const a1 = pick(bi.key);
    if(a1) arts.push(a1);
    if(bi.pair){ const a2 = pick(bi.pair); if(a2) arts.push(a2); }
  }
  if(!arts.length && C.P.map==='versa_dgn2'){
    const yb = MONREF && MONREF['yumebanken_f'];
    if(yb) arts.push(yb);
  }
  if(arts.length){
    const sc = Math.max(1, Math.round(ts/TS*0.6));
    // 2たいの ときは よこに ならべる（すこし かさねて 1くみに みせる）
    const gap = arts.length>1 ? Math.round(ts*0.30) : 0;
    let ok = true;
    const imgs = arts.map(a=>getImg(a.src || a.front));
    imgs.forEach(im=>{ if(!(im.complete && im.naturalWidth)) ok = false; });
    if(ok){
      arts.forEach((a, i)=>{
        const ww = a.w*sc, hh = a.h*sc;
        const off = (arts.length>1) ? ((i===0 ? -1 : 1) * gap) : 0;
        cx.drawImage(imgs[i],
          Math.round(dx + s/2 - ww/2 + off),
          Math.round(dy + s*0.95 - hh), ww, hh);
      });
      return;
    }
  }
  cx.fillStyle='rgba(60,20,80,0.5)';
  cx.beginPath(); cx.ellipse(dx+s/2, dy+s*0.6, s*0.42, s*0.34, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle='#c8324a';
  cx.fillRect(px(dx+s*0.32), px(dy+s*0.45), Math.max(2,s*0.09), Math.max(2,s*0.07));
  cx.fillRect(px(dx+s*0.59), px(dy+s*0.45), Math.max(2,s*0.09), Math.max(2,s*0.07));
}
function getImg(src){
  if(!imgCache[src]){ const i=new Image(); i.src=src; imgCache[src]=i; }
  return imgCache[src];
}
function drawChar(a, ox, oy, ts, time){
  const d = CHRREF && CHRREF[a.cls];
  const dx = ox + a.x*ts, dy = oy + a.y*ts;
  const sc = ts/TS;                       // タイルの ばいりつ（かならず せいすう）
  cx.fillStyle='rgba(16,20,34,0.30)';
  cx.beginPath(); cx.ellipse(dx+ts/2, dy+ts*0.86, ts*0.26, ts*0.10, 0, 0, Math.PI*2); cx.fill();
  if(!d){ cx.fillStyle='#c8d0e0'; cx.fillRect(px(dx+ts*0.3),px(dy+ts*0.2),ts*0.4,ts*0.6); return; }
  let pose = a.pose in d ? a.pose : 'front';
  const img = getImg(d[pose]);
  if(!img.complete || !img.naturalWidth) return;
  // ★タイルと おなじ ばいりつで えがく ＝ ドットの あらさが そろう
  //   よこむきは はばが ちがう ので、その えの はばを つかう
  const baseW = (pose.indexOf('side')===0 && d.sideW_) ? d.sideW_ : d.w;
  const ww = Math.round(baseW*sc), hh = Math.round(d.h*sc);
  const bx = Math.round(dx + ts/2 - ww/2);
  const by = Math.round(dy + ts*0.95 - hh + (a.bob||0)*ts);
  cx.save();
  if(a.flip){ cx.translate(bx+ww, by); cx.scale(-1,1); cx.drawImage(img, 0, 0, ww, hh); }
  else cx.drawImage(img, bx, by, ww, hh);
  cx.restore();
}
function drawSnow(dt, ts){
  const col = (curTS && curTS.id!=='NORMAL') ? '#d8bff5' : '#ffffff';
  cx.fillStyle = col;
  const rate = curTS ? curTS.snowRate : 1;
  snow.forEach(f=>{
    f.y += dt*f.v*rate*0.35;
    f.x += Math.sin((f.y+f.v)*6)*0.0012;
    if(f.y>1){ f.y=-0.02; f.x=Math.random(); }
    cx.globalAlpha = 0.75;
    cx.fillRect(px(f.x*W), px(f.y*H), f.s*2, f.s*2);
  });
  cx.globalAlpha = 1;
}
function drawAurora(time){
  const g = cx.createLinearGradient(0,0,0,H*0.42);
  const a1 = 0.16+0.06*Math.sin(time*0.5), a2 = 0.12+0.05*Math.sin(time*0.37+1.4);
  g.addColorStop(0,   'rgba(90,240,180,0)');
  g.addColorStop(0.35,'rgba(90,240,180,'+a1+')');
  g.addColorStop(0.62,'rgba(120,200,255,'+a2+')');
  g.addColorStop(1,   'rgba(180,120,255,0)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H*0.42);
  cx.globalAlpha=0.10;
  cx.fillStyle='#ffffff';
  for(let i=0;i<10;i++){
    const x=((i*97+time*22)%(W+120))-60;
    cx.fillRect(px(x), 0, 3, H*0.34);
  }
  cx.globalAlpha=1;
}
function drawTint(){
  if(curTS && curTS.id!=='NORMAL'){
    cx.fillStyle = curTS.id==='DREAM_INVASION'
      ? 'rgba(110,60,170,0.30)' : 'rgba(150,120,200,0.16)';
    cx.fillRect(0,0,W,H);
  }
  if(curNight){ cx.fillStyle='rgba(20,26,60,0.34)'; cx.fillRect(0,0,W,H); }
  // まわりを くらくして おくゆきを だす
  const g = cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.30, W/2,H/2,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1, curTS && curTS.id==='DREAM_INVASION' ? 'rgba(30,8,50,0.55)' : 'rgba(0,0,0,0.42)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
}
function setFade(v){ fadeV = v; }
// ★ゆめみ：がめんを しろく とばして、おとが とおのいた かんじに する
let dreamOn = false;
function setDream(on){ dreamOn = !!on; }
// ★いま ゆきが ふる ばしょか（ワールドは いちで きめる）
const SNOW_AREAS = [
  {x0:24, y0:0,  x1:72, y1:24},   // ヴェルサ（きたの せつげん）
  {x0:0,  y0:24, x1:26, y1:50},   // エルデ（にしの れいほう）
];
// ★ゆきの ありなしを いまの いちで あわせる
function updateSnow(){
  const want = snowHere();
  if(want === snowOn) return;
  snowOn = want;
  if(want){
    flakes = 90;
    snow = [];
    for(let i=0;i<flakes;i++)
      snow.push({x:Math.random(), y:Math.random(), v:0.25+Math.random()*0.5, s:1+Math.random()*2});
  }else{
    flakes = 0; snow = [];
  }
}
function snowHere(){
  if(curMap !== 'world') return !!(curScene && curScene.snowfall);
  const x = C.P.x, y = C.P.y;
  return SNOW_AREAS.some(a=>x>=a.x0 && x<=a.x1 && y>=a.y0 && y<=a.y1);
}
function drawDream(){
  if(!dreamOn) return;
  cx.fillStyle = 'rgba(236,244,255,0.42)';

  const g = cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.18, W/2,H/2,Math.max(W,H)*0.62);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(200,220,255,0.55)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
}

function homePoint(){
  // ★章データの home を さいゆうせん（章を ふやしても ここを さわらない）。
  //   これを わすれると、第2章で ぜんめつしても 第1章の まちへ もどされる。
  const cd = chData();
  if(cd && cd.home && MAPS[cd.home.map] && walkable(cd.home.map, cd.home.x, cd.home.y)){
    return cd.home;
  }
  const h = HOME[G.chapter] || HOME[1];

}
function townStateDef(){ return WORLD.TOWN_STATES[G.townState] || WORLD.TOWN_STATES.NORMAL; }
function mkMember(cls, lv){
  const c = CLASSES[cls];
  const m = {cls, name:c.name, lv:1, exp:0,
    maxhp:c.hp, maxmp:c.mp, batk:c.atk, bdef:c.def, agi:c.agi,
    weapon:null, armor:null, status:null};
  for(let i=1;i<lv;i++){
    m.lv++; m.maxhp+=c.g.hp; m.maxmp+=c.g.mp; m.batk+=c.g.atk; m.bdef+=c.g.def;
    if(m.lv%2===0) m.agi+=c.g.agi;
  }
  m.hp=m.maxhp; m.mp=m.maxmp;
  return m;
}
function expNext(m){ return m.lv>=LV_CAP ? Infinity : m.lv*m.lv*6; }
function mAtk(m){ return m.batk + (m.weapon?m.weapon.v:0); }
function mDef(m){ return m.bdef + (m.armor?m.armor.v:0); }

const SPELL_TAG = {dmg:'たんたい', dmgall:'ぜんたい', heal:'かいふく',
                   healall:'ぜんたいかいふく', cure:'じょうたい', revive:'そせい',
                   defdown:'しゅびさげ', 'return':'いどう'};
function spellLabel(s){
  const tag = SPELL_TAG[s.type] || '';
  return s.name + '　' + s.mp + (tag ? '　' + tag : '');
}
function knownSpells(m){
  return CLASSES[m.cls].learns.filter(l=>m.lv>=l.lv)
    .map(l=>Object.assign({key:l.key}, SPELL_DEFS[l.key]));
}
function aliveMembers(){ return party.filter(p=>p.hp>0); }
function actableMembers(){ return party.filter(p=>p.hp>0 && p.status!=='sleep'); }

// 章ごとの きまりごとは src/chapters.js に まとめてある。
const CHD = (typeof CHAPTERS_DATA!=='undefined') ? CHAPTERS_DATA
          : (typeof require!=='undefined' ? require('./chapters.js') : null);
function chData(){ return CHD ? CHD.get(G.chapter||1) : null; }

const SOLID = new Set(['#','f','w','o','T','F','K','~','^','H','e','y','j']);
function tileAt(map,x,y){
  const m = MAPS[map]; if(!m) return '#';
  if(y<0||x<0||y>=m.tiles.length||x>=m.tiles[y].length) return '#';
  return m.tiles[y][x];
}
function isBlocked(ch){
  return SOLID.has(ch) || ch==='I' || ch==='P' || ch==='S' || ch==='W' || ch==='M'
      || ch==='n' || ch==='C' || ch==='B'
      || ch==='Q';                                   // Q は しらべる たいしょう
}
function walkable(map,x,y){ return !isBlocked(tileAt(map,x,y)); }
function warpAt(map,x,y){
  const m = MAPS[map]; if(!m) return null;
  if(m.warpsXY && m.warpsXY[x+','+y]) return m.warpsXY[x+','+y];
  const ch = tileAt(map,x,y);
  if(m.warps && m.warps[ch]) return m.warps[ch];
  return null;
}

function facing(){
  const d = P.dir||'front';
  const dx = d==='left' ? -1 : d==='right' ? 1 : 0;
  const dy = d==='back' ? -1 : d==='front' ? 1 : 0;
  return {x:P.x+dx, y:P.y+dy, dx, dy};
}
function interact(){
  if(G.mode!=='field' || G.busy) return false;
  const f = facing();
  const nx = f.x, ny = f.y, dx = f.dx, dy = f.dy;
  const ch = tileAt(P.map,nx,ny);
  // 施設・人物は「ぶつかって」作用
  if(ch==='n'){ talkNPC(nx,ny); return; }
  if(ch==='I'){ useInn(); return; }
  if(ch==='P'){ useChurch(); return; }
  if(ch==='S'||ch==='W'||ch==='M'){ openShop(ch); return; }
  if(ch==='C'){ openChest(nx,ny); return; }
  if(ch==='A'||ch==='V'||ch==='X'){          // ワールドの ちてん
    const w=warpAt(P.map,nx,ny);
    if(w){
      // ★けっかい：じょうけんが そろうまで はいれない
      const wd = WARDS[w.to];
      if(wd && (G.chapter||1)===wd.chapter && !G.flags[wd.flag]){
        G.mode='msg';
        U.msg(wd.msg, ()=>{ G.mode='field'; });
        return;
      }
      doWarp(w); return;
    }
  }
  if(ch==='Q'){                               // まだ いけない ちほう
    G.mode='msg';
    U.msg(['とおくに まちの かげが みえる。',
           'だが いまの ' + (party[0] ? party[0].name : 'かれら') + 'には、ここから さきへ すすむ すべが ない。',
           '（この ちほうは これから つくられます）'], ()=>{ G.mode='field'; });
    return;
  }
  if(ch==='B'){ triggerBoss(nx,ny); return; }
  // ★さんどうの こや：かぎを あずけて ある。まものに あらされて いる。
  if(ch==='y' && P.map==='elde_path' && (G.chapter||1)===4){
    G.mode='msg';
    if(!G.flags.ch4_sawHut){
      G.flags.ch4_sawHut = true;
      questAdvance('ch4_q1_key','active');
      U.msg(['こやの とびらが、うちがわから やぶられて いる。',
             'ゆかに たなが たおれ、ぬのが ちらばって いた。',
             '',
             'ミオ「……かぎを しまって おいた はこが、ない」',
             'ゼフ「おおきな あしあとじゃ。ひとの ものでは ない」',
             'ゼフ「まだ とおくには いっておらん。においが のこっとる」',
             'ミオ「おくへ いきましょう。とりかえします」',
             '', '＊ クエスト「とうの かぎを とりかえす」＊'], ()=>{ G.mode='field'; });
      return;
    }
    if(hasKey('towerkey')){
      U.msg(['あらされた こや。もう、とる ものは ない。'], ()=>{ G.mode='field'; });
      return;
    }
    U.msg(['あらされた こや。かぎは もちさられて いる。',
           'ゼフ「おくちじゃ。きたの おくへ すすめ」'], ()=>{ G.mode='field'; });
    return;
  }
  // ★けっかい：じょうけんが そろうまで はいれない。
  //   （まどろみの しもべを たおすまで かいしょくどうへ はいれない）
  {
    const w0 = warpAt(P.map, nx, ny);
    if(w0 && WARDS[w0.to] && !G.flags[WARDS[w0.to].flag] && (G.chapter||1)===WARDS[w0.to].chapter){
      G.mode='msg';
      U.msg(WARDS[w0.to].msg, ()=>{ G.mode='field'; });
      return;
    }
  }
  // ★こぶね：さんばしの さきで A を おすと うみを わたる。
  //   ふなのりの いらいを こなすまで のれない（イベントの いみを もたせる）。
  // ★かえりの こぶね（ワールドの はまべ）
  if(((G.chapter||1)===3 ? G.flags.ch3_paidFare : (G.chapter||1)>=5) && P.map==='world'
     && nx===FERRY_BACK.x && ny===FERRY_BACK.y){
    G.mode='msg';
    U.msg(FERRY_BACK.msg, ()=>{ doWarp({to:FERRY_BACK.to, x:FERRY_BACK.tx, y:FERRY_BACK.ty}); });
    return;
  }
  if(((G.chapter||1)===3 || (G.chapter||1)>=5) && FERRY[P.map]){
    const f = FERRY[P.map];
    if(nx===f.x && ny===f.y){
      G.mode='msg';
      if((G.chapter||1)===3 && !G.flags.ch3_paidFare){
        U.msg(['こぶねが つないである。',
               'だが かってに つかう わけには いかない。',
               'ふなのりに たのもう。'], ()=>{ G.mode='field'; });
        return;
      }
      U.msg(f.msg, ()=>{ doWarp({to:f.to, x:f.tx, y:f.ty}); });
      return;
    }
  }
  // ★ゆめみ：ちほうと しょうの じょうけんが そろえば おきる
  if(ch==='o' && P.map==='minamo_dgn1' && (G.chapter||1)===3
     && G.flags.ch3_enteredCave && !G.flags.ch3_sawDream){
    if(triggerDream()) return;
  }
  if(ch==='K' && P.map==='versa_cast1'){        // ★しろの なかの K は ぎょくざ
    G.mode='msg';
    U.msg(G.flags.ch1_cleared
      ? ['ヴェルサの ぎょくざ。','おうは しずかに こしかけている。']
      : ['ヴェルサの ぎょくざ。きんの かざりが にぶく ひかっている。',
         'おうは むすめの ことばかり かんがえて いるようだ。'],
      ()=>{ G.mode='field'; });
    return;
  }
  if(ch==='K'){                                 // まちの おうじょうもん
    G.mode='msg';
    const F = G.flags;
    // ★おうめいを うけていなくても、はなしが すすんでいれば とおす。
    //   （しろに はいらず ミルカへ さきに いくと、くすりを もっているのに
    //     もんで とめられて つみに なる ふぐあいが あった）
    const mayEnter = F.ch1_orderReceived || F.ch1_heardTheft || F.ch1_gotHerb
                  || F.ch1_cleared || hasKey('yukigusa') || hasKey('medicine');
    if(mayEnter){
      if(!F.ch1_orderReceived) F.ch1_orderReceived = true;   // つじつまを あわせる
      U.msg([F.ch1_cleared
              ? 'えいへい「おかえりなさいませ」'
              : 'えいへい「おうじょさまの ことだな。とおれ」'], ()=>{
        doWarp({to:'versa_cast1', x:10, y:14});
      });
    }else if(G.townState==='NORMAL'){
      U.msg(['おうじょうの もん。えいへいが かたく まもっている。',
             'えいへい「しんまいが かってに はいるな」'], ()=>{ G.mode='field'; });
    }else{
      U.msg(['おうじょうの もん。えいへいの かおいろが わるい。',
             'えいへい「おうめいの ない ものは とおせぬ」',
             'えいへい「きしだんちょうの ゆるしを もらってこい」'], ()=>{ G.mode='field'; });
    }
    return;
  }
  if(ch==='Z'){                       // ねむる おうじょ
    G.mode='msg';
    const F=G.flags;
    if(F.ch1_cleared){
      U.msg(['おうじょさまは まだ ねむっている。',
             'まくらもとの くすりの うつわは、からに なっている。'], ()=>{ G.mode='field'; });
      return;
    }
    if(hasKey('medicine') && !F.ch1_usedMedicine){        // ★くすりを つかう ばめん
      F.ch1_usedMedicine=true; takeKey('medicine');
      questAdvance('ch1_q4_medicine','clear');
      U.msg([
        'リオンは めざめの くすりを おうじょさまの くちもとへ はこんだ。',
        'じい「……のみこまれた。あとは まつだけ じゃ」',
        '……',
        'しかし、まぶたは ひらかない。',
        'じい「そんな ばかな。ゆきぐさが きかぬ ねむりなど……」',
        'おう「では これは、ただの びょうでは ないと いうことか」'
      ], ()=>{ triggerEnding(); });
      return;
    }
    if(F.ch1_gotHerb && !hasKey('medicine')){
      U.msg(['おうじょさまは ねむったまま。',
             'じい「ゆきぐさを もってきたのじゃな。ミルカの くすしに くすりに して もらうのじゃ」'],
        ()=>{ G.mode='field'; });
      return;
    }
    const first=!F.ch1_sawPrincess;
    F.ch1_sawPrincess=true;
    U.msg(first
      ? ['ベッドに おうじょさまが ねむっている。',
         'いくら よびかけても、まぶたは ひらかない。',
         'じい「わしの てには おえぬ。……ただ ひとつ、こころあたりが ある」',
         'じい「となりまち ミルカに ＜ゆきぐさ＞ という くすりぐさが ある。',
         'あれなら どんな ねむりも さますと いわれておる」',
         'じい「せつげんを にしへ ぬければ ミルカじゃ。たのむぞ、リオン」',
         '＊ クエスト「ゆきぐさを もとめて」＊']
      : ['おうじょさまは しずかに ねむっている。'],
      ()=>{ if(first) questAdvance('ch1_q2_herb','active'); G.mode='field'; });
    return;
  }
  if(ch==='F'){
    G.mode='msg';
    U.msg(G.townState==='DREAM_INVASION'
      ? ['ちゅうおうひろばの ふんすい。みずが むらさきに にごっている。']
      : ['ちゅうおうひろばの ふんすい。こおりついた みずが ひかっている。'],
      ()=>{ G.mode='field'; });
    return;
  }
  // なにも なければ
  G.mode='msg';
  U.msg(['そこには なにも ない。'], ()=>{ G.mode='field'; });
  return true;
}

function stepField(dx,dy){
  if(G.mode!=='field' || G.busy) return;
  const nx=P.x+dx, ny=P.y+dy;
  const ch = tileAt(P.map,nx,ny);
  // ★ぶつかっただけでは なにも おきない。しらべるのは Aボタン（interact）。
  //   ワープの ます（もん・かいだん・ちてん）は ふんだら すすむ。
  P.dir = dy<0?'back' : dy>0?'front' : (dx<0?'left':'right');
  // ★ふね：もやって ある ふねに あるいて ふれると のる
  if(!G.aboard && P.map==='world' && G.ship && nx===G.ship.x && ny===G.ship.y){
    G.aboard=true;
    G.trail.unshift([P.x,P.y]); if(G.trail.length>8) G.trail.pop();
    P.x=nx; P.y=ny; G.stepFlip=!G.stepFlip;
    V.setActors();
    return;
  }
  // ★ふね：うみを すすむ／りくに あがる（うみでは まものは でない）
  if(G.aboard){
    if(ch==='~'){
      G.trail.unshift([P.x,P.y]); if(G.trail.length>8) G.trail.pop();
      P.x=nx; P.y=ny; G.stepFlip=!G.stepFlip;
      V.setActors();
      return;
    }
    if(walkable(P.map,nx,ny)){
      G.ship={x:P.x, y:P.y};                 // ふねを のこして あがる
      G.aboard=false;
    }else return;
  }
  if(!walkable(P.map,nx,ny)) return;
  G.trail.unshift([P.x,P.y]); if(G.trail.length>8) G.trail.pop();
  P.dir = dy<0?'back' : dy>0?'front' : (dx<0?'left':'right');   // むきを おぼえる
  P.x=nx; P.y=ny; G.stepFlip=!G.stepFlip;
  V.setActors();
  const w = warpAt(P.map,nx,ny);
  // ★けっかい：じょうけんが そろうまで はいれない
  if(w){
    const wd = WARDS[w.to];
    if(wd && (G.chapter||1)===wd.chapter && !G.flags[wd.flag]){
      G.mode='msg';
      U.msg(wd.msg, ()=>{ G.mode='field'; });
      return;
    }
  }
  if(w){ doWarp(w); return; }
  if(MAPS[P.map].enc) maybeEncounter();
}
// ワールドマップは ばしょによって なまえが かわる
function areaName(map,x,y){
  if(map==='world' && tileAt(map,x,y)==='~') return 'おおうみ';
  const m=MAPS[map];
  if(!m || !m.encZones) return WORLD.mapName(map);
  const z=(m.encZones||[]).find(z=>x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1);
  return z ? z.name : WORLD.mapName(map);
}
function doWarp(w){
  G.busy=true;
  if(A.door) A.door();
  V.fade(1, ()=>{
    P.map=w.to; P.x=w.x; P.y=w.y; P.dir='front';
    G.trail=[[w.x,w.y],[w.x,w.y]];
    G.visited[w.to]=true;
    if(w.to==='world') G.flags.ch1_enteredField=true;
    // ★章データの onEnter / onEnterState
    {
      const cd = chData();
      if(cd){
        if(cd.onEnter && cd.onEnter[w.to]) G.flags[cd.onEnter[w.to]] = true;
        if(cd.onEnterState && cd.onEnterState[w.to] && WORLD.TOWN_STATES[cd.onEnterState[w.to]])
          G.townState = cd.onEnterState[w.to];
      }
    }
    if(TRADE_MARKET[w.to]) G.marketTick = (G.marketTick|0) + 1;   // そうばが うごく
    if(w.to==='versa_town2') G.flags.ch1_reachedMirka=true;
    if(w.to==='versa_dgn1' && !G.flags.ch1_enteredCave){
      G.flags.ch1_enteredCave=true;
      G.townState='DREAM_INVASION';        // まちが ゆめに しんしょくされる
    }
    V.buildMap(w.to); V.setActors(); U.label(areaName(w.to, w.x, w.y));
    A.bgm(w.to);
    V.fade(0, ()=>{ G.busy=false; G.mode='field'; });   // メッセージ中から呼ばれても操作可へ戻す
  });
}
let encSteps = 0;
function maybeEncounter(){
  encSteps++;
  const m = MAPS[P.map];
  let rate = (m && m.encRate!==undefined) ? m.encRate : 0.085;
  const grace = (m && m.encGrace!==undefined) ? m.encGrace : 3;
  // ★もりの なかは みとおしが わるく、まものに あいやすい
  if(tileAt(P.map,P.x,P.y)===',') rate *= 1.8;
  if(encSteps<grace) return;                 // たたかいの ちょくごに また、を ふせぐ
  if(Math.random()<rate){ encSteps=0; startBattle(null); }
}

// ---------------- NPC・施設 ----------------
function talkNPC(x,y){
  const entry = NPCDATA.npcAt(P.map, x, y);
  G.mode='msg';
  if(!entry){ U.msg(['「……」'], ()=>{ G.mode='field'; }); return; }
  const lines = NPCDATA.pickLines(entry, {townState:G.townState, flags:G.flags, chapter:(G.chapter||1)});
  // ★こうえきしょう は はなすと あきないが できる（バルドの ミニイベント）
  if(entry.name === 'こうえきしょう'){
    if(party[0] && party[0].cls !== 'bald'){
      U.msg(['こうえきしょう「あきないは しょうにんの しごとさ」',
             '「あんたには むいて いないよ」'], ()=>{ G.mode='field'; });
      return;
    }
    U.msg(lines, ()=>{ G.mode='menu'; U.openTrade && U.openTrade(); });
    return;
  }
  // ★ものがたりの できごとが ある ときは、そちらを だす（ふだんの せりふは ださない）。
  //   りょうほう だすと おなじ ことを 2かい いう ことに なる（じっさいに でた ふぐあい）。
  if((G.chapter||1)!==1 && runTalkEvent(entry.name)) return;
  U.msg(lines, ()=>{ questOnTalk(entry.name); G.mode='field'; });
}
// ---------------- クエスト ----------------
// ---------------- 章データの ものがたりを うごかす ----------------
// chapters.js の talkEvents を じょうから みて、さいしょに あてはまった ものを おこなう。
// これに よって、章を ふやす ときに ここを さわらなくて すむ。
function matchEvent(e){
  const F = G.flags;
  if(e.unless && F[e.unless]) return false;                 // もう おきている
  if(e.cond && !e.cond.every(f=>F[f])) return false;         // まえの じょうけんが そろって いない
  if(e.when && e.when.state && G.townState !== e.when.state) return false;
  if(e.needKey && !hasKey(e.needKey)) return false;
  if(e.needGold && P.gold < e.needGold) return false;
  if(e.needQuota && !(G.quota && G.quota.n >= G.quota.need)) return false;  // ★いらいが おわって いない
  return true;
}
function runTalkEvent(npcName){
  const cd = chData();
  if(!cd || !cd.talkEvents) return false;
  const e = cd.talkEvents.find(ev => ev.npc === npcName && matchEvent(ev));
  if(!e) return false;

  (e.set || []).forEach(f => { G.flags[f] = true; });
  if(e.setState && WORLD.TOWN_STATES[e.setState]) G.townState = e.setState;
  if(e.takeKey) takeKey(e.takeKey);
  if(e.giveKey) giveKey(e.giveKey);
  if(e.moor){ G.ship={x:e.moor[0], y:e.moor[1]}; G.aboard=false; }   // ★ふねを さずける
  if(e.heal){ party.concat(reserve).forEach(m=>{ m.hp=m.maxhp; m.mp=m.maxmp; m.status=null; }); U.hud(); }
  if(e.join){                                    // ★なかまが くわわる（'lead'＝せんとうと おなじLv）
    (Array.isArray(e.join)?e.join:[e.join]).forEach(j=>{
      const lv = j.lv==='lead' ? (party[0]?party[0].lv:1) : (j.lv||1);
      const m = joinMember(j.cls, lv);
      if(m){                                     // そぶりの そうびを もって くる
        if(j.weapon) m.weapon = Object.assign({}, j.weapon);
        if(j.armor)  m.armor  = Object.assign({}, j.armor);
      }
    });
  }
  if(e.startQuota){                              // ★いらいを うける
    G.quota = {n:0, need:e.startQuota.need|0, flag:e.startQuota.flag};
  }
  if(e.clearQuota) G.quota = null;
  if(e.takeGold) P.gold = Math.max(0, P.gold - e.takeGold);
  if(e.gold) P.gold += e.gold;
  Object.keys(e.quest || {}).forEach(q => questAdvance(q, e.quest[q]));

  const lines = (e.msg || []).slice();
  U.msg(lines, () => {
    U.hud();
    // 章の おわりに たっしたか
    if(cd.ending && cd.ending.trigger && G.flags[cd.ending.trigger] && !G.flags[(cd.ending.set||[])[0]]){
      triggerChapterEnd();
      return;
    }
    G.mode = 'field';
  });
  return true;
}
// ---------------- ゆめみ（第3章）----------------
// ダンジョンの ある ますに たつと、セナの ちからで ゆめが みえる。
// がめんの いろが かわり、ものがたりが ひとつ すすむ。
function triggerDream(){
  if(G.flags.ch3_sawDream) return false;
  G.flags.ch3_sawDream = true;
  questAdvance('ch3_q2_dream','clear');
  questAdvance('ch3_q3_twins','active');
  G.dreaming = true;
  if(V.setDream) V.setDream(true);          // がめんを ゆめの いろに
  G.mode = 'msg';
  U.msg([
    'セナの あしが とまった。',
    'セナ「……みえる」',
    '',
    '＊ うみが しろく なり、おとが とおのく ＊',
    '',
    'ちいさな ふたりの おんなのこが、なみうちぎわで うたっている。',
    'ふたりは まったく おなじ かおを している。',
    '＜おきて＞　＜おきないで＞',
    'ふたつの こえが、おなじ くちから きこえた。',
    '',
    'ルカ「セナ！ しっかりして！」',
    'セナ「……おくに いる。ふたりで ひとりの、かなしい ゆめが」'
  ], () => {
    G.dreaming = false;
    if(V.setDream) V.setDream(false);
    U.hud();
    G.mode = 'field';
  });
  return true;
}

// 章の おわりに 「つぎへ すすむ」か「この しょうを つづける」を えらばせる
function offerNextChapter(next, title, isFinal){
  if(isFinal){
    G.mode = 'msg';
    U.msg(['＊＊ ルミナクエスト III　かんけつ ＊＊',
           '',
           'ながい たびに おつきあい いただき、',
           'ありがとう ございました！',
           'せかいは、めざめの あさを むかえた。'],
          () => { G.mode='field'; });
    return;
  }
  const ready = next && CHD && CHD.has(next);
  G.mode = 'msg';
  if(!ready){
    U.msg(['＊＊ ' + (title||'') + ' かんけつ ＊＊',
           '（つづきの しょうは これから つくります）'], () => { G.mode='field'; });
    return;
  }
  const nc = CHD.get(next);
  U.msg(['＊＊ ' + (title||'') + ' かんけつ ＊＊',
         'つぎは 第' + next + 'しょう「' + nc.title + '」。'], () => {
    G.mode = 'menu';
    U.menu(['第' + next + 'しょうへ すすむ', 'この しょうを つづける'], 'これから', (k) => {
      if(k === 0){
        switchChapter(next);
        G.mode = 'msg';
        V.buildMap(P.map); V.setActors(true);
        U.label(WORLD.mapName(P.map)); U.hud();
        A.bgm(P.map);
        V.chapterCard('第' + next + 'しょう', nc.title, () => { G.mode = 'field'; });
      }else G.mode = 'field';
    });

}
function triggerChapterEnd(){
  const cd = chData();
  if(!cd || !cd.ending){ G.mode='field'; return; }
  const en = cd.ending;
  (en.set || []).forEach(f => { G.flags[f] = true; });
  G.cleared = true;
  Object.keys(en.quest || {}).forEach(q => questAdvance(q, en.quest[q]));
  G.mode = 'msg';
  U.msg(en.msg || ['……'], () => {
    const card = en.card || {title:'', sub:''};
    V.chapterCard(card.title, card.sub, () => { offerNextChapter(en.next, cd.title, en.final); });
  });
}

function questAdvance(id, state){
  if(!NPCDATA.QUESTS[id]) return;
  G.quests[id]=state;
}
function questList(){
  // ★いまの しょうの クエストだけを だす（べつの しょうの まぎれこみ よけ）
  const ch = G.chapter||1;
  return Object.keys(G.quests).filter(k=>G.quests[k]==='active')
    .map(k=>NPCDATA.QUESTS[k])
    .filter(q=>q && (!q.chapter || q.chapter===ch));

// ボスの ばしょ・とうじょうの ことば・たおした あとは 章データから ひく
function bossInfoAt(map){
  if(!CHD) return null;
  // まず いまの 章、なければ ぜんしょうから さがす（えがきは どの マップでも ひく）
  const here = CHD.bossAt(G.chapter||1, map);
  if(here) return here;
  for(const no of CHD.list()){
    const b = CHD.bossAt(no, map);
    if(b) return b;
  }
  return null;
}
function triggerBoss(x,y){
  // ★章データに かかれた ボスを ひく（章を ふやしても ここは さわらない）
  const bi = bossInfoAt(P.map);
  if(bi){
    G.mode='msg';
    if(bi.clearedFlag && G.flags[bi.clearedFlag]){
      U.msg(bi.after || ['もう だれも いない。'], ()=>{ G.mode='field'; });
      return;
    }
    // ★いらいを うけて いないと たたかいに ならない
    if(bi.needFlag && !G.flags[bi.needFlag]){
      U.msg(bi.lockMsg || ['まだ ここには ようが ない。'], ()=>{ G.mode='field'; });
      return;
    }
    // ★だいじなものが ないと たたかいに ならない
    if(bi.needKey && !hasKey(bi.needKey)){
      U.msg(bi.lockMsg || ['まだ ここには はいれない。'], ()=>{ G.mode='field'; });
      return;
    }
    U.msg(bi.intro || ['まものが たちふさがった！'], ()=>{ startBattle(bi.key); });
    return;
  }
  if(G.flags.desgran){
    G.mode='msg';
    U.msg(['まおうの きえた あとに、こげた いわだけが のこっている。'], ()=>{ G.mode='field'; });
    return;
  }
  G.mode='msg';
  U.msg(['どうくつの さいおくに、ぜつぼうの ちからが とぐろを まいている。',
         'デスグラン「よくぞ ここまで きたな、ちいさき ひかりよ。',
         'すべてを のみこむ やみを、その めに やきつけよ！」',
         'まおう デスグランが たちふさがった！'], ()=>{ startBattle('desgran1'); });
}
function openShop(kind){
  const list = SHOPS[P.map+':'+(kind||'S')]; if(!list) return;
  G.mode='menu';
  const items = list.map(it=>it.name+'　'+it.price+'G').concat(['やめる']);
  U.menu(items, 'なにを かいますか？', (sel)=>{
    if(sel>=list.length){ G.mode='field'; return; }
    const it = list[sel];
    G.mode='msg';
    if(P.gold < it.price){ U.msg(['ゴールドが たりないようです。'], ()=>{ G.mode='field'; }); return; }
    P.gold -= it.price;
    if(it.kind==='h'){ P.herbs++; U.msg([it.name+'を かった！'], ()=>{ U.hud(); G.mode='field'; }); return; }
    if(it.kind==='wtr'){ P.waters++; U.msg([it.name+'を かった！'], ()=>{ U.hud(); G.mode='field'; }); return; }
    // その わくが いちばん よわい なかまに そうび（きゅうそうびは ふくろへ）
    const slot = it.kind==='w'?'weapon':'armor';
    const target = party.slice().sort((a,b)=>
      ((a[slot]?a[slot].v:0)-(b[slot]?b[slot].v:0)))[0];
    if(target[slot] && target[slot].v>=it.v){
      U.msg(['すでに もっと よい そうびを つけています。'], ()=>{ P.gold+=it.price; U.hud(); G.mode='field'; });
      return;
    }
    if(target[slot]) P.equipBag.push(target[slot]);
    target[slot] = {kind:it.kind, name:it.name, v:it.v};
    U.msg([it.name+'を かった！', target.name+'が そうびした！'], ()=>{ U.hud(); G.mode='field'; });
  });
}
