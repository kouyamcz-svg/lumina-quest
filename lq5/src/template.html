#fstat{position:absolute;right:8px;top:52px;width:36%;box-sizing:border-box;display:none;border:2px solid var(--line);background:rgba(10,8,18,.94);border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.5}

#bmark{position:absolute;display:none;color:#ffe060;font-size:20px;text-shadow:0 0 3px #000;pointer-events:none}
#hint{display:none!important;position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--dim);background:rgba(18,15,28,.7);padding:3px 8px;border-radius:4px}

// ★外の 世界の 絵を 1ます 32ドットで 描く（草原・海・浜辺・街道・川・橋は ここで 描き、

  function sea(v){ const c=mk(TS,TS),g=c.getContext('2d'); for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){ const r=hsh(x,y,v+9); P(g,x,y,1,1, r<.5?'#2a56a4':r<.92?'#2f5fb0':'#3a6cbe'); }
    for(let i=0;i<4;i++){ const x=Math.floor(hsh(i,v,3)*24), y=Math.floor(hsh(v,i,4)*28)+2; P(g,x,y,6,1,'#6a9ae0'); P(g,x+2,y-1,3,1,'#a8c8f0'); } return c; }

    for(let i=0;i<3;i++){ const x=Math.floor(hsh(i,v,5)*24), y=Math.floor(hsh(v,i,6)*28)+2; P(g,x,y,5,1,'#9fd0f4'); } return c; }
  function beach(v){ const c=mk(TS,TS),g=c.getContext('2d'); for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){ const r=hsh(x,y,v+29); P(g,x,y,1,1, r<.1?'#c8aa6c':r<.6?'#dcc088':r<.95?'#e4ca94':'#f2dcae'); }

  function road(v){ const c=mk(TS,TS),g=c.getContext('2d'); for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){ const r=hsh(x,y,v+39); P(g,x,y,1,1, r<.12?'#b08c58':r<.6?'#c8a46a':r<.95?'#d2ae74':'#dcbc86'); }
    for(let i=0;i<6;i++){ const x=Math.floor(hsh(i,v,9)*29)+1, y=Math.floor(hsh(v,i,10)*29)+1; P(g,x,y,2,2,'#9a7a4a'); P(g,x,y,1,1,'#e2c696'); } return c; }

  function dark(v){ const c=mk(TS,TS),g=c.getContext('2d'); for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){ const r=hsh(x,y,v+59); P(g,x,y,1,1, r<.15?'#2a1e30':r<.7?'#3a2a42':r<.95?'#463452':'#5a4466'); } return c; }

      if(dir==='n') g.fillRect(i,0,1,k); if(dir==='s') g.fillRect(i,TS-k,1,k); if(dir==='w') g.fillRect(0,i,k,1); if(dir==='e') g.fillRect(TS-k,i,k,1); }
    const cr=(x0,y0)=>{ for(let y=0;y<10;y++)for(let x=0;x<10;x++){ if(x+y<9-((x*y)%3)) g.fillRect(x0?TS-1-x:x, y0?TS-1-y:y,1,1); } };

  for(let i=bPops.length-1;i>=0;i--){ const p=bPops[i]; p.t+=dt; if(p.t>=p.life){ p.e.remove(); bPops.splice(i,1); continue; }
    const k=p.t/p.life, y=p.y+p.vy*p.t+210*p.t*p.t, x=p.x+p.vx*p.t, size=p.base*(1+Math.max(0,.35-k*1.6));

let FXP=[], FXS=[], fxCv=null;
function fxCanvas(){ if(!fxCv){ fxCv=document.createElement('canvas'); fxCv.id='fxcv'; btEl.insertBefore(fxCv,btEl.firstChild); }
  const w=btEl.clientWidth, h=btEl.clientHeight; if(fxCv.width!==w||fxCv.height!==h){ fxCv.width=w; fxCv.height=h; } return fxCv; }
function fxAt(who,key,crit){ try{ const st=FXS_DEF[key]||FXS_DEF.w_elt, c=fxCanvas(), W=c.width, H=c.height; let [x,y]=popXY(who); if(who.foe) y+=H*.06; else y-=8;
  const big=(st.big||crit)?1.5:1, R=Math.random;
  for(let i=0;i<st.n*big;i++){ const a=R()-.5; FXP.push({x,y,vx:a*st.spread*big,vy:-(40+R()*st.up*big),g:900,life:.5+R()*.2,col:st.col[i%2],sz:2+R()*2*big}); }
  if(st.flame) for(let i=0;i<st.flame*big;i++) FXP.push({x:x+(R()-.5)*60*big,y:y+20,vx:(R()-.5)*30,vy:-(60+R()*160),g:-60,life:.6+R()*.4,col:['#ffd060','#ff8a20','#ff4a10'][i%3],sz:3+R()*4,grow:1});
  if(st.ring) for(let i=0;i<16;i++){ const th=i/16*6.283; FXP.push({x,y,vx:Math.cos(th)*190*big,vy:Math.sin(th)*120*big*(st.sink?.4:1)+(st.sink?80:0),g:0,life:.45,col:st.col[1],sz:3}); }
  if(st.haze) for(let i=0;i<12;i++) FXP.push({x:x+(R()-.5)*90,y:y+(R()-.5)*70,vx:(R()-.5)*40,vy:-20,g:0,life:.9+R()*.3,col:st.col[0],sz:6,grow:1,soft:1});
  if(st.rise) for(let i=0;i<16;i++) FXP.push({x:x+(R()-.5)*70,y:y+30+R()*20,vx:(R()-.5)*14,vy:-(60+R()*90),g:-20,life:.8+R()*.3,col:st.col[i%2],sz:3,star:1});
  if(st.slash!=='none') FXS.push({t:0,life:st.slash==='bolt'?.35:.28,kind:st.slash,x,y,col:st.col[0],col2:st.col[1],big,faint:st.faint,seed:R()*1000,H});
  if(st.big||crit){ BT.flash=Math.max(BT.flash,.8); BT.quake=Math.max(BT.quake,.4); }
}catch(e){} }
function fxTick(dt){ if(!fxCv && !FXP.length && !FXS.length) return; const c=fxCanvas(), g=c.getContext('2d'); g.clearRect(0,0,c.width,c.height);
  FXS=FXS.filter(s=>{ s.t+=dt; if(s.t>=s.life) return false; const k=s.t/s.life, a=(1-k)*(s.faint?.5:1), L=110*s.big, th=6*s.big;
    g.save(); g.globalAlpha=a; g.fillStyle=s.col; g.strokeStyle=s.col; g.shadowColor=s.col2; g.shadowBlur=10;
    const bar=(ang,len,w)=>{ g.save(); g.translate(s.x,s.y); g.rotate(ang); const grow=Math.min(1,k*4); g.fillRect(-len/2,-w/2,len*grow,w); g.restore(); };
    if(s.kind==='v') bar(Math.atan2(1,.3)-Math.PI,L,th);
    else if(s.kind==='h') bar(0,L*1.4,th);
    else if(s.kind==='down') bar(Math.atan2(1,.6)-Math.PI,L,th*1.8);
    else if(s.kind==='x'){ bar(Math.atan2(.9,1),L,th); bar(Math.atan2(-.9,1),L,th); }
    else if(s.kind==='stab'){ g.translate(s.x,s.y); g.fillRect(-L*.5,-th*.4,L*(.3+.7*k),th*.8); g.beginPath(); g.arc(0,0,th*(1+k*3),0,6.283); g.globalAlpha=a*.5; g.fill(); }
    else if(s.kind==='claw'){ for(let i=-1;i<=1;i++){ g.save(); g.translate(s.x+i*16*s.big,s.y); g.rotate(-.5); g.fillRect(-L*.35,-2*s.big,L*.7*Math.min(1,k*4),4*s.big); g.restore(); } }
    else if(s.kind==='bolt'){ g.lineWidth=4*s.big; g.lineJoin='round'; g.beginPath(); let px=s.x+(Math.sin(s.seed)*30), py=0; g.moveTo(px,py); const steps=9;
      for(let i=1;i<=steps;i++){ const ny=s.y*i/steps; const nx=s.x+(i<steps?(Math.sin(s.seed+i*7.1)*26*s.big):0); g.lineTo(nx,ny); } g.stroke();
      g.lineWidth=1.5*s.big; g.strokeStyle='#ffffff'; g.stroke(); g.beginPath(); g.arc(s.x,s.y,14*s.big*(1+k),0,6.283); g.globalAlpha=a*.45; g.fillStyle=s.col2; g.fill(); }
    g.restore(); return true; });

    else g.fillRect(Math.round(p.x),Math.round(p.y),z,z); return true; });
  g.globalAlpha=1; }

function battleTick(dt,now){
  if(BT.steps.length){ BT.st-=dt*(SND.speed||1); while(BT && BT.st<=0 && BT.steps.length){ const f=BT.steps.shift(); BT.st=f(); } }
  if(!BT){ return; }
  BT.flash=Math.max(0,BT.flash-dt*5); BT.quake=Math.max(0,BT.quake-dt);
  // ★画面の 横幅に 収める：魔物の 立つ 奥行きで 見える 横の 半分の 幅を 求め、数に 合わせて 並べ、はみ出す ときは 小さく する（縦長の スマホでは 横が せまい）
  const n=BT.foes.length, depth=4.3-EZ, halfW=Math.tan(batCam.fov*Math.PI/360)*depth*batCam.aspect*.92, cell=2*halfW/n;
  BT.foes.forEach(f=>{
    f.x = -halfW + cell*(f.slot+.5);
    if(f.frame==='idle') f.idleAr=f.ar; const H0=1.75*(f.def.scale||1), fit=Math.min(1, cell*.95/(H0*(f.idleAr||f.ar))), H=H0*fit;   /* ★大きさは 待機の こまの 幅で 決める（攻撃の こまが 横に 長くても 小さく ならない） */
    const off=(f.frame==='atk'&&f.def.atkOff)?H*f.ar*f.def.atkOff:0;   /* ★攻撃の こまが 右へ 伸びる 絵は、体の 位置が 動かない よう ずらす */
    f.hop=Math.max(0,f.hop-dt*3.2); f.lunge=Math.max(0,f.lunge-dt*2.6); f.shake=Math.max(0,f.shake-dt); f.hurt=Math.max(0,f.hurt-dt);
    const sx=f.shake>0?Math.sin(now/22)*.05:0;
    const lz=Math.sin(Math.min(1,f.lunge)*Math.PI)*1.6, sc=1+Math.sin(Math.min(1,f.lunge)*Math.PI)*.18+Math.sin(Math.min(1,f.hop)*Math.PI)*.05;
    const hy=Math.sin(Math.min(1,f.hop)*Math.PI)*.22+(f.def.float?.35+Math.sin(now/420+f.x)*.08:0);
    const breath=1+Math.sin(now/380+f.x*2)*.02;
    if(f.def.frames.idle2 && (f.frame==='idle'||f.frame==='idle2')){ const k=Math.floor(now/550)%2?'idle2':'idle'; if(f.frame!==k) setFoeFrame(f,k); }
    f.mesh.scale.set(H*f.ar*sc, H*sc*(f.shake>0?1:breath), 1); f.mesh.position.set(f.x+sx+off,hy,EZ+f.z+lz); f.sh.position.set(f.x+sx,.02,EZ+f.z+lz);
    f.mesh.visible = !(f.hurt>0 && Math.floor(now/60)%2===0);
    // ★倒した とき：速く 点滅して から 消える
    if(f.dead){ f.ex=Math.max(0,f.ex-dt*1.25); f.mesh.visible = f.ex>0.08 && Math.floor(now/70)%2===0; f.sh.visible = f.ex>0.08; }
  });
  popTick(dt); fxTick(dt);
  flashEl.style.opacity=BT.flash*.7;
  (BG.fortFires||[]).concat(BG.burnFires||[]).forEach(m=>{ m.scale.y=1+Math.sin(now/90+m.userData.ph)*.18; });
  const q=BT.quake>0?Math.sin(now/18)*.06:0;
  batCam.position.set(q,1.25,4.3); batCam.lookAt(0,.95,0);

    const r=cv.getBoundingClientRect(); bmark.style.left=((_v.x+1)/2*r.width-10)+'px'; bmark.style.top=((1-_v.y)/2*r.height-26+Math.sin(now/150)*3)+'px'; }
  R.render(batScene,batCam); }

const expNeed=(lv)=>lv*lv*6;                       // Ⅳと 同じ：次の レベルまでの 経験値

function questTalk(id,lines){ const q=QUESTS[id], st=ST.q[id], sp=lines[0].split('「')[0];   /* ★話す 人の 名前は 最初の 台詞と 同じに */
  if(st==='済み') return say([sp+'「あの 時は 助かったよ」']);
  if(!st){ say(lines.concat(['＊ 頼みごと「'+q.name+'」を 受けた ＊']),()=>{ ST.q[id]='受けた'; ST.kill=ST.kill||{}; ST.qbase=ST.qbase||{}; ST.qbase[id]=(ST.kill[q.foe]||0); }); return; }
  const done = q.foe ? ((ST.kill||{})[q.foe]||0)-((ST.qbase||{})[id]||0)>=q.need : (BAG[q.item]>0);
  if(!done) return say([sp+'「'+q.ask+'」']);
  if(q.item) BAG[q.item]--; BAG.gold+=q.reward.gold; ST.q[id]='済み'; se('chest'); say([sp+'「ありがとう！ これは お礼だ」','＊ '+q.reward.gold+'ゴールドを 受け取った ＊']); }
function requestList(){ const ids=Object.keys(ST.q||{}); if(!ids.length) return ['頼まれごとは まだ ない。','（町の 人の 中に、困って いる 人が いる かも しれない）'];
  const out=[]; ids.forEach(id=>{ const q=QUESTS[id], done=ST.q[id]==='済み'; const n=q.foe?Math.min(q.need,((ST.kill||{})[q.foe]||0)-((ST.qbase||{})[id]||0)):null;
    const ready=!done && (q.foe ? n>=q.need : BAG[q.item]>0);
    out.push((done?'【済み】':ready?'【報告へ】':'【受けた】')+q.name, '　頼んだ人：'+q.from+'　内容：'+q.text+(n!==null&&!done?'（'+n+'／'+q.need+'）':'')+'　お礼：'+q.reward.gold+'G'); }); return out; }
function questList(){ const out=['【目的】','　'+goalText()]; const ids=Object.keys(ST.q||{}); if(ids.length){ out.push('【頼みごと】'); ids.forEach(id=>{ const q=QUESTS[id]; const n=q.foe?Math.min(q.need,((ST.kill||{})[q.foe]||0)-((ST.qbase||{})[id]||0)):null;
  out.push('　'+(ST.q[id]==='済み'?'（済）':'')+q.name+'：'+q.text+(n!==null&&ST.q[id]!=='済み'?'（'+n+'／'+q.need+'）':'')); }); } return out; }

function buildDun(d){ S.background=new THREE.Color(d.bg); S.fog=new THREE.Fog(d.fog[0],d.fog[1],d.fog[2]);

  const fl=L(T.stone,d.floor), wl=L(T.cliff,d.wall);
  d.rows.forEach((r,y)=>[...r].forEach((c,x)=>{ add(box,fl,x+.5,-.5,y+.5);
    if(c==='#'){ const h=d.wallH*(d.look==='rock'?(.8+((x*7+y*3)%5)*.12):1); add(box,wl,x+.5,h/2,y+.5,1,h,1); }
    if(c==='M'){ // 古代の 機械
      add(new THREE.CylinderGeometry(.34,.4,1.3,10),L(null,0x5a6a72),x+.5,.65,y+.5); add(new THREE.TorusGeometry(.32,.06,6,16),L(null,0x40e0d0,{emissive:0x20a0a0}),x+.5,1.0,y+.5).rotation.x=Math.PI/2;
      add(new THREE.SphereGeometry(.14,10,8),L(null,0x80fff0,{emissive:0x40c0c0}),x+.5,1.45,y+.5); }
    if(c==='W'||c==='E'||c==='S') add(box,L(null,0x2a1a10),x+.5,.02,y+.5,.9,.04,.9);
  }));
  const toWall=(x,z)=>{ const rows=DUNS[DUN_NOW].rows, cx=Math.floor(x), cz=Math.floor(z); for(const [a,b] of [[1,0],[-1,0],[0,-1],[0,1]]){ const c=rows[cz+b]&&rows[cz+b][cx+a]; if(c==='#'||c==='M') return [cx+.5+a*.42, cz+.5+b*.42]; } return null; };   /* ★小物は 壁ぎわへ（通路の 真ん中で すり抜けて 見えた） */

      'ヴェルナ王「アルディアの 兵士よ。国境の 村の こと……すまなかった」','ヴェルナ王「和平の 席を 設けよ。アルディアの 使者と、わたしが 直に 話す」','ヴェルナ王「……あの 者の 戻らぬ うちに」'],()=>showEnd2()); return; }
  say(['ヴェルナ王「…………」','うつろな 目は、どこも 見て いない。']); }
// ---- 夜の 塔（王女）----
const TOWER_ROOM={name:'城の 塔', rows:["WWWWWWWWW","W.f...b.W","W.......W","W...T...W","W.......W","Wp.....pW","WWWWXWWWW"]};
function enterTower(){ [hero.p,...followers.map(f=>f.p)].forEach(p=>{ p.m.visible=true; p.sh.visible=true; }); cv.style.display='block'; c2.style.display='none'; newG(); drops=[]; fireLight=null; doorPiv=[]; roomDoor=null; anims=[]; buildRoom(TOWER_ROOM);
  S.background=new THREE.Color(0x0a0c1a); amb.intensity=.4; amb.color.setHex(0xa0b0ff);
  cur={kind:'tower', rows:TOWER_ROOM.rows, solid:new Set(['W','s','b','T','f','p']), npcs:cur.npcs, room:null};
  setNpcs([{x:4.5,y:2.3,spr:'lidia',name:'王女 リディア',talk:()=>lidiaTalk()}].concat(ST.phase==='c2_tower'?[{x:6.5,y:4.6,spr:'maid',name:'侍女',lines:['侍女「見張りの からくりが 回って くるまで、少しの 間です」','侍女「どうか 王女さまの お話を」']}]:[]));
  hero.x=4.5; hero.z=TOWER_ROOM.rows.length-2.3; hero.ang=Math.PI; resetTrail();
  document.getElementById('place').textContent='帝都の 城の 塔（夜）'; resize(); }
function lidiaTalk(){ if(ST.phase!=='c2_tower') return say(['リディア「行きましょう」']);
  say(['リディア「来て くれて ありがとう。わたしは リディア。この 国の 王女です」','リディア「謁見の 間で 見たでしょう。……父は、数年前から 人が 変わりました」','リディア「側近の セルヴィスの 言うことしか 聞かない。まるで 人形の ように」',
    'リディア「セルヴィスは、わたしの 教育係でした。幼い ころから ずっと」','リディア「なのに……昔 一緒に 摘んだ 花の 話を しても、何も 覚えて いないの」','リディア「あの 人は、本当に セルヴィスなのか……」',
    'リディア「セルヴィスは 夜ごと、西の 森の 遺跡へ 通って います。そこに 何かが ある」','リディア「わたしは 城の からくりに 見張られて いて、一人では 出られない」','リディア「エルト。……わたしと 一緒に 遺跡へ 行って くれませんか」','＊ リディアが 仲間に 加わった！ ＊'],
    ()=>{ joinParty('lidia',Math.max(STATS.elt.lv,10)); ST.phase='c2_ruins'; say(['からくりの 見張りが 向こうを 向いた すきに、2人は 城を 抜け出した。'],()=>go(()=>enterWorld([92.5,26.4]))); }); }
function startCh2(){ const c=document.getElementById('card'); c.style.opacity=0; ST.phase='c2_dolm'; refreshFollowers(); enterTown([11.5,15.5],'velna');
  say(['── 第2章　操られた 王 ──','次の 朝。ドルムの 町に、帝国の 迎えが 着いた。']); }
function showEnd2(){ ST.phase='c2_end'; const c=document.getElementById('card'); c.innerHTML='<div>第2章</div><div class="t">操られた 王</div><div>完</div><div style="font-size:13px;margin-top:20px">── 第3章へ つづく ──</div>'; c.style.opacity=1; }

function resize(){ const v=document.getElementById('view'); const w=v.clientWidth,h=v.clientHeight; R.setSize(w,h,false); C.aspect=w/h; C.updateProjectionMatrix(); batCam.aspect=w/h; batCam.updateProjectionMatrix(); }
addEventListener('resize',()=>{resize(); if(cur.kind==='world') resize2();}); resize();
loadImgs(()=>{ hero.p=person('elt'); followers=PARTY.slice(1).map(k=>({p:person(k),x:hero.x,z:hero.z,ang:Math.PI})); hero.x=12; hero.z=4.4; hero.ang=Math.PI; enterTown(null);   // ★ガイル（12.5,2.6）と 重ならない 位置から
  C.position.set(hero.x,10.5,hero.z+6.2); requestAnimationFrame(tick);
  if(hasSave()){ setTimeout(()=>{ menu(['つづきから','はじめから'],'ぼうけんの きろく',(k)=>{ closeMenu(); if(k===0 && loadGame()) say(['きろくの つづきから はじめる。']); else say(['── 国境の 村 ルーエ ──','見張り櫓の 当番を 終えた 朝。','エルトは、師匠 ガイルに 呼ばれて いた。','＊ 村の 北の 入口に いる ガイルに 話しかけよう ＊']); }); MENU.lock=1; },300); return; }
  setTimeout(()=>say(['── 国境の 村 ルーエ ──','見張り櫓の 当番を 終えた 朝。','エルトは、師匠 ガイルに 呼ばれて いた。','＊ 村の 北の 入口に いる ガイルに 話しかけよう ＊']),300); });
